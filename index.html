ag">${s.transactions.reduce((n,t)=>n+t.comments.length,0)}개</span></div>${s.transactions.filter(t=>t.comments.length).slice(0,2).map(t=>`<div class="comment"><b>${esc(t.name)}</b><br>${esc(t.comments[t.comments.length-1])}</div>`).join('')||'<p class="muted">아직 부모님의 코멘트가 없어요.</p>'}`)}${card(`<strong>🧾 내 카드 결제 내역</strong>${txList(false)}${btn('결제 내역 보기','go(\'cards\')','alt full')}`)}`:`<h2>부모님 대시보드 👨‍👩‍👧</h2><div class="card hero"><div class="small">남은 미션 보상 예산</div><div class="big">${won(remain())} P</div><div class="muted">충전 설정 ${won(s.fund)}P · 지급 ${won(s.earned)}P</div></div><div class="grid"><button class="tile" onclick="go('charge')"><span class="emoji">💳</span><strong>포인트 충전</strong><span class="muted">보상 예산 추가</span></button><button class="tile" onclick="go('cards')"><span class="emoji">🧾</span><strong>카드 결제 내역</strong><span class="muted">결제별 코멘트</span></button></div>${card(`<div class="row"><strong>🎓 금융역량 학습</strong><span class="pill">${s.done.length}/6 완료</span></div><div class="progress"><div style="width:${s.done.length/6*100}%"></div></div><div class="chips">${areas.map((a,i)=>`<span class="chip">${a[0]} ${s.done.includes(i)?'✓':''}</span>`).join('')}</div>`)}${card(`<strong>💬 최근 카드 결제</strong>${txList(false)}${btn('소비 코칭하기','go(\'cards\')','alt full')}`)}`}

if(page==='wallet'){h=`<h2>💜 내 포인트 지갑</h2><div class="card hero"><div>사용 가능 포인트</div><div class="big">${won(balance())} P</div><div class="muted">적립 ${won(s.earned)}P · 교환 ${won(s.spent)}P · 저축 ${won(s.saved)}P</div></div>${card(`<strong>🐷 목표 저금통</strong><div class="progress"><div style="width:${Math.min(100,s.saved/s.goal*100)}%"></div></div><div class="row small"><b>${won(s.saved)}P</b><span>목표 ${won(s.goal)}P</span></div><label class="label">목표 포인트</label><input class="field" id="goal" type="number" min="1" value="${s.goal}">${btn('목표 변경','setGoal()','alt')}<label class="label" style="display:block;margin-top:12px">저축할 포인트</label><input class="field" id="deposit" type="number" min="1" placeholder="예: 500"><div class="row">${btn('저금통에 넣기','deposit()')}${btn('저금통에서 꺼내기','withdraw()','line')}</div>`)}${card(`<strong>✨ 포인트 적립 내역</strong>${s.logs.map(l=>`<div class="itemline">${esc(l.text)} <b style="float:right">+${won(l.amount)}P</b><div class="muted">${esc(l.date)}</div></div>`).join('')||'<div class="empty">미션을 완료하고 포인트를 모아보세요!</div>'}`)}${card(`<strong>🧾 카드 결제 내역</strong>${txList(false)}`)}`}

if(page==='charge'){h=`<h2>💳 부모 포인트 충전</h2><div class="card hero"><div>남은 보상 예산</div><div class="big">${won(remain())} P</div><div class="muted">누적 등록 ${won(s.fund)}P · 미션 지급 ${won(s.earned)}P</div></div>${card(`<strong>충전할 포인트 선택</strong><div class="chips" style="margin:13px 0">${[1000,5000,10000,20000].map(n=>`<button class="btn alt" onclick="document.getElementById('chargeAmt').value=${n}">${won(n)}P</button>`).join('')}</div><label class="label">추가할 포인트</label><input id="chargeAmt" class="field" type="number" min="1" max="100000" value="10000">${btn('포인트 충전 시연하기','charge()','full')}<p class="notice">실제 카드 결제나 현금 이체는 발생하지 않습니다. 부모가 보상 예산을 등록하는 가상 충전입니다. 실제 서비스에서는 결제사업자 제휴 및 관련 법률 검토가 필요합니다.</p>`)}${card(`<strong>⚙️ 보상 정책</strong><div class="itemline">금융역량 미션 최초 완료 <b style="float:right">1,000P</b></div><div class="itemline">가족 금융 대화 완료 <b style="float:right">500P</b></div><div class="itemline">포인트샵 교환 <b style="float:right">자녀 적립 포인트 차감</b></div>`)}${card(`<strong>👪 부모 교육 가이드</strong><p class="small">용돈을 줄 때: 필요한 지출과 원하는 지출을 함께 구분해 보세요.</p><p class="small">예산을 초과했을 때: 혼내기보다 선택한 이유를 먼저 물어보세요.</p><p class="small">금융 대화: 정답을 말해주기보다 아이의 생각을 들어보세요.</p>`)}`}

function txList(all){return s.transactions.slice(0,all?99:3).map(t=>`<div class="record"><div class="bubble">${esc(t.emoji)}</div><div class="details"><strong>${esc(t.name)}</strong><div class="muted">${esc(t.date)} · 코멘트 ${t.comments.length}개</div></div><span class="amount">-${won(t.amount)}원</span></div>`).join('')||'<div class="empty">결제 내역이 없어요.</div>'}function answer(){let a=areas[quiz];if(chosen<0)return toast('답을 하나 선택해 주세요.');if(chosen!==a[4])return toast('다시 생각해 봐요! '+a[5]);if(!s.done.includes(quiz)){s.done.push(quiz);if(reward(1000,a[1]+' 미션 완료'))toast('정답! 1,000P 적립 완료 ✨');else toast('정답! 보상 예산 부족으로 포인트는 지급되지 않았어요.');save()}else toast('정답! 이미 완료한 미션이에요.');go('missions')}function charge(){let n=Number(document.getElementById('chargeAmt').value);if(!Number.isInteger(n)||n<1||n>100000)return toast('1~100,000P 사이로 입력해 주세요.');s.fund+=n;save();render();toast(won(n)+'P 가상 충전 완료!')}function buy(id){let p=products.find(x=>x.id===id);if(!p||balance()<p.price)return toast('교환할 포인트가 부족해요.');if(!confirm(p.name+'에 '+won(p.price)+'P를 사용해 시연용 교환을 진행할까요? 실제 상품은 발급되지 않습니다.'))return;s.spent+=p.price;s.orders.unshift({name:p.name,date:new Date().toLocaleDateString('ko-KR')});save();render();toast('교환 체험 완료! 실제 상품 발급은 없어요.')}function addTx(){let name=document.getElementById('merchant').value.trim(),amount=Number(document.getElementById('txAmount').value);if(!name||!Number.isInteger(amount)||amount<=0||amount>10000000)return toast('가맹점과 올바른 결제 금액을 입력해 주세요.');s.transactions.unshift({id:Date.now(),name:name.slice(0,40),amount,date:new Date().toLocaleDateString('ko-KR'),emoji:'💳',comments:[]});save();render();toast('시연용 결제 내역을 추가했어요.')}function addTxComment(id){let el=document.getElementById('comment'+id),c=el&&el.value.trim(),t=s.transactions.find(x=>x.id===id);if(!c||!t)return toast('코멘트를 입력해 주세요.');t.comments.push(c.slice(0,300));save();render();toast('부모님 코멘트를 남겼어요.')}function setGoal(){let n=Number(document.getElementById('goal').value);if(!Number.isInteger(n)||n<1||n>100000 function visitTown(name,p){if(!v.townVisits.includes(name))v.townVisits.push(name);v4save();go(p)}
function toggleGood(i){let j=v.marketCart.indexOf(i);if(j>=0)v.marketCart.splice(j,1);else v.marketCart.push(i);v4save();render()}
function finishMarket(){let goods=[2500,2300,1200,1800,6500,2100],total=v.marketCart.reduce((a,i)=>a+goods[i],0);if([0,1,2,5].every(i=>v.marketCart.includes(i))&&total<=10000){v4reward('market')}else toast(total>10000?'예산을 초과했어요. 다시 골라봐요.':'필요한 4가지 물건을 모두 담아보세요.')}
function buyStock(){if(v.businessCash<1000)return toast('재료비가 부족해요.');v.businessCash-=1000;v.businessStock++;v4save();render()}
function sellStock(){if(v.businessStock<1)return toast('재료를 먼저 구매해요.');v.businessStock--;v.businessCash+=1600;v.businessSales++;v4save();render()}
function finishBusiness(){if(v.businessSales<2)return toast('컵케이크를 2개 이상 판매해 보세요.');v4reward('business')}
function buyAccessory(e,p){if(v.avatarAccessories.includes(e))return toast('이미 가지고 있어요.');if(balance()<p)return toast('포인트가 부족해요.');s.spent+=p;v.avatarAccessories.push(e);v4save();render()}
function detectiveAnswer(answer,right){if(answer!==right)return toast('다시 생각해 봐요. 안전과 약속을 먼저 확인해요.');v.detective++;v4save();if(v.detective>=3)v4reward('detective');else {render();toast('사건 해결! 다음 사건으로 이동했어요.')}}
function addGift(){let n=document.getElementById('giftName').value.trim(),p=+document.getElementById('giftPrice').value,w=+document.getElementById('giftWeeks').value;if(!n||!Number.isInteger(p)||p<1||p>10000000||!Number.isInteger(w)||w<1||w>104)return toast('목표·금액·기간을 확인해 주세요.');v.giftGoals.unshift({name:n.slice(0,60),price:p,weeks:w});v4save();v4reward('gift')}
function addWait(){let n=document.getElementById('waitName').value.trim(),p=+document.getElementById('waitPrice').value;if(!n||!Number.isInteger(p)||p<1||p>10000000)return toast('물건과 가격을 입력해 주세요.');v.decisionWait.unshift({name:n.slice(0,60),price:p,at:Date.now()});v4save();render()}
function finishWait(i,keep){let x=v.decisionWait[i];if(!x)return;if(Date.now()-x.at<86400000)return toast('24시간이 지난 뒤 결정할 수 있어요.');v.decisionWait.splice(i,1);v4save();v4reward('wait');toast(keep?'구매 계획을 다시 확인했어요.':'구매하지 않기로 결정했어요.')}
function coachAsk(i){let q=[['간식에 5,000원을 쓰고 싶어요.','이번 주에 꼭 필요한 지출이 있는지 먼저 살펴볼까요?'],['친구에게 돈을 빌려도 될까요?','돈을 빌리기 전에 다른 방법과 갚을 계획을 생각해 볼까요?'],['선물을 사고 싶어요.','목표 금액과 남은 기간을 정해 저축 계획을 세워볼까요?'],['게임 아이템이 너무 사고 싶어요.','지금 사는 선택과 조금 기다리는 선택을 비교해 볼까요?']][i];v.coachHistory.push({q:q[0],a:q[1]});v4save();render();toast('생각해 볼 질문을 추천했어요.')}
function emergencyChoice(good){if(!good)return toast('비상금을 모두 쓰면 갑작스러운 지출에 대비하기 어려워요.');if(v.emergency<1500)return toast('비상금이 부족해요.');v.emergency-=1500;v4save();v4reward('emergency')}
function sendLetter(){let t=document.getElementById('letterText').value.trim(),p=+document.getElementById('letterPoints').value;if(!t||!Number.isInteger(p)||p<0||p>2000)return toast('미션 내용과 0~2,000P 보상을 확인해 주세요.');v.letters.push({id:Date.now(),text:t.slice(0,160),points:p,done:false,requested:false});v4save();render();toast('미션 편지를 보냈어요.')}
function requestLetter(id){let x=v.letters.find(x=>x.id===id);if(!x)return;x.requested=true;v4save();render();toast('부모님께 완료 승인을 요청했어요.')}
function approveLetter(id){let x=v.letters.find(x=>x.id===id);if(!x||x.done||!x.requested)return;if(x.points&&!reward(x.points,'부모 미션 편지 완료'))return;x.done=true;v.petXP++;v4save();render();toast('미션을 승인했어요.')}

let mp11ChildName='';

function mp11SaveChildName(){const el=document.getElementById('mp11ChildNameInput');if(!el)return;const next=el.value.trim().slice(0,20);if(!next){toast('어린이 이름을 입력해 주세요.');return;}mp11ChildName=next;localStorage.setItem(MP11_PROFILE_KEY,JSON.stringify({name:next}));toast('어린이 이름을 저장했어요.');render();}
const mp11PreviousRender=render;
render=function(){mp11PreviousRender();if(page!=='home')return;const screen=document.getElementById('screen');if(!screen)return;if(mode==='child'){
const title=screen.querySelector('h2');if(title){title.textContent=mp11ChildName?mp11ChildName+'님의 금융 놀이터 💜':'나의 금융 놀이터 💜';}
}else{

const h=screen.querySelector('h2');if(h)h.insertAdjacentElement('afterend',panel);else screen.prepend(panel);
}}

const MP12_KEY='money_play_v12_profile';
let mp12Profile={name:mp11ChildName||'',color:'#7755b5',face:'🐻'};
try{const old=JSON.parse(localStorage.getItem(MP12_KEY)||'{}');if(old&&typeof old==='object')mp12Profile={...mp12Profile,...old};}catch(e){}
if(!mp12Profile.name&&mp11ChildName)mp12Profile.name=mp11ChildName;
const MP12_COLORS=['#7755b5','#d76594','#2b8b8b','#4d7bc7','#c07b35'];
const MP12_FACES=['🐻','🐰','🐱','🐼','🦊'];
function mp12SaveProfile(){const name=document.getElementById('mp12Name');if(!name)return;const val=name.value.trim();if(!val||val.length>16){toast('닉네임을 1~16자로 입력해 주세요.');return;}mp12Profile.name=val;mp11ChildName=val;localStorage.setItem(MP12_KEY,JSON.stringify(mp12Profile));localStorage.setItem(MP11_PROFILE_KEY,JSON.stringify({name:val}));render();toast('나만의 닉네임을 저장했어요!');}
function mp12Color(c){if(!MP12_COLORS.includes(c))return;mp12Profile.color=c;localStorage.setItem(MP12_KEY,JSON.stringify(mp12Profile));render();}
function mp12Face(f){if(!MP12_FACES.includes(f))return;mp12Profile.face=f;localStorage.setItem(MP12_KEY,JSON.stringify(mp12Profile));render();}
function mp12Editor(){return `<div class="mp12-editor"><strong>✨ 나만의 닉네임 꾸미기</strong><p class="muted" style="margin:7px 0 10px">이름과 프로필 색상, 캐릭터를 직접 고를 수 있어요.</p><label class="label" for="mp12Name">내 닉네임</label><input class="field" id="mp12Name" maxlength="16" value="${esc(mp12Profile.name)}" placeholder="예: 저축왕 민지"><div class="label" style="margin-top:12px">프로필 캐릭터</div><div class="mp12-face-row">${MP12_FACES.map(f=>`<button type="button" class="mp12-face ${mp12Profile.face===f?'selected':''}" onclick="mp12Face('${f}')" aria-label="${f} 캐릭터 선택">${f}</button>`).join('')}</div><div class="label">닉네임 색상</div><div class="mp12-color-row">${MP12_COLORS.map(c=>`<button type="button" class="mp12-swatch ${mp12Profile.color===c?'selected':''}" style="background:${c}" onclick="mp12Color('${c}')" aria-label="프로필 색상 변경"></button>`).join('')}</div>${btn('닉네임 저장하기','mp12SaveProfile()','full')}</div>`;}
function mp12Header(){return `<div class="mp12-profile"><div class="mp12-avatar">${esc(mp12Profile.face)}</div><div class="mp12-profile-text"><small>MONEY PLAY · 나의 금융생활</small><b style="color:${mp12Profile.color}">${esc(mp12Profile.name||'나의 닉네임')}님의 금융 놀이터</b></div><button class="mp12-mini" onclick="mp12ToggleEditor()">꾸미기 ✎</button></div>`;}

function mp12MoneyPage(){return `<h2>💵 내 용돈 지갑</h2><div class="card walletHero"><div>사용 가능한 용돈</div><div class="big">${won(u.cash)}원</div><div class="muted" style="color:#eefcff">원 단위 · 포인트와 별도 관리</div></div>${card(`<strong>🧾 용돈 사용 기록</strong><label class="label" for="cashName">사용한 곳</label><input id="cashName" maxlength="40" class="field" placeholder="예: 문구점"><label class="label" for="cashAmount">금액 (원)</label><input id="cashAmount" type="number" class="field" min="1" placeholder="예: 1500">${btn('지출 기록하기','cashExpense()','full')}`)}${card(`<div class="mp12-ledger-head"><strong>📅 용돈 입출금 내역</strong><span class="pill">최근 ${Math.min(25,u.cashLogs.length)}건</span></div>${mp12Ledger(u.cashLogs)}`)}`;}

 }

function chatPage(){let a=areas.find((a,i)=>s.done.includes(i))||areas[0];return `<h2>💬 우리 가족 금융 톡</h2><div class="chat-shell"><div class="chat-head">👨‍👩‍👧 우리 가족 <span class="muted" style="float:right">시연용 채팅방</span></div><div class="chat-body" id="chatBody">${u.chat.map(m=>`<div class="chat-line ${m.from===mode?'mine':''}"><div class="chat-avatar">${m.from==='parent'?'👩':'🧒'}</div><div><div class="chat-bubble">${esc(m.text)}</div></div><span class="chat-time">${esc(m.at)}</span></div>`).join('')}</div><form class="chat-compose" onsubmit="sendFamilyMessage(event)"><input id="chatInput" maxlength="250" placeholder="메시지를 입력하세요" autocomplete="off" aria-label="가족 메시지"><button type="submit">전송</button></form></div><div class="notice">같은 브라우저에서 부모·어린이 모드를 바꾸면 서로의 메시지를 확인할 수 있어요. 실제 다른 기기와 연결되는 메신저는 아니며, 아이 모드에서는 시연용 자동 답장이 도착합니다.</div>${card(`<strong>💡 오늘의 금융 대화 주제</strong><p class="small">${esc(a[2])}</p><div class="chips">${suggestions.slice(0,3).map((q,i)=>`<button class="pill-tab" onclick="quickMessage(${i})">${i+1}. 질문 보내기</button>`).join('')}</div>`)}${mode==='parent'?card(`<strong>🎁 금융 대화 보상</strong><p class="small">자녀와 실제로 대화한 뒤 부모가 완료를 확인하면 500P를 지급합니다.</p>${btn('대화 완료 확인 · 500P','finishTalk()','full')}`):card(`<strong>✨ 대화 기록</strong><p class="muted">금융 대화 완료 ${s.talks}회 · 부모님의 완료 확인 후 포인트 지급</p>`)}`}
function autoReply(t){let x=t.toLowerCase();if(/저축|모으|목표/.test(x))return '좋은 생각이야! 목표 금액을 정하고 매주 얼마씩 모을지 같이 계산해 보자 💜';if(/간식|사고|구매|쇼핑|물건/.test(x))return '그렇구나! 필요한 물건인지, 예산이 얼마나 남았는지 함께 확인해 볼까? 🛒';if(/빌리|갚|친구/.test(x))return '친구와 돈이나 물건을 빌릴 때는 약속을 지키는 게 중요하지. 어떻게 하면 좋을까? 🤝';if(/사기|비밀번호|링크/.test(x))return '맞아, 비밀번호는 꼭 지켜야 해! 수상한 링크가 오면 누르지 말고 어른에게 알려줘 🔐';if(/고마|사랑|안녕/.test(x))return '오늘도 이야기해 줘서 고마워! 우리 같이 하나씩 배워 보자 😊';return ['재미있는 생각이네! 왜 그렇게 생각했는지 더 이야기해 줄래?','그 선택의 좋은 점과 아쉬운 점을 같이 생각해 볼까?','오늘 배운 금융 미션을 실제 생활에 적용해 보면 어떨까?'][u.chatTurns%3]}
function sendFamilyMessage(e){e.preventDefault();let el=document.getElementById('chatInput'),t=el.value.trim();if(!t)return;let at=new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});u.chat.push({from:mode,text:t.slice(0,250),at});if(mode==='child'){u.chatTurns++;u.chat.push({from:'parent',text:autoReply(t),at})}if(u.chat.length>120)u.chat=u.chat.slice(-120);v5save();render();let body=document.getElementById('chatBody');if(body)body.scrollTop=body.scrollHeight}
function quickMessage(i){let el=document.getElementById('chatInput');if(!el)return;el.value=suggestions[i];el.focus()}

const previousGo=go;
go=function(p){if(removedGamePages.has(p))p='missions';previousGo(p)};
function piggyPage(){const pct=Math.min(100,Math.round(u.cashSaved/Math.max(1,u.cashGoal)*100));return `<h2>🐷 나의 돼지 저금통</h2><p class="muted">용돈에서 조금씩 저축하며 목표를 달성해 보세요.</p><div class="card"><div class="row"><strong>나의 저축 목표</strong><span class="pill">${pct}% 달성</span></div>${pigSvg()}<div class="row"><b>${won(u.cashSaved)}원 모았어요</b><span class="muted">목표 ${won(u.cashGoal)}원</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="row small"><span class="muted">목표까지 남은 금액</span><b>${won(Math.max(0,u.cashGoal-u.cashSaved))}원</b></div></div>${card(`<strong>🎯 저축 목표 정하기</strong><label class="label" for="cashGoal">목표 금액 (원)</label><input id="cashGoal" type="number" min="1" class="field" value="${u.cashGoal}">${btn('목표 변경','setCashGoal()','alt full')}`)}${card(`<strong>💰 저금통에 돈 넣고 꺼내기</strong><p class="muted">용돈 지갑 잔액 ${won(u.cash)}원 · 저금통 잔액 ${won(u.cashSaved)}원</p><label class="label" for="cashSaveAmt">금액 (원)</label><input id="cashSaveAmt" type="number" min="1" class="field" placeholder="예: 1000"><div class="grid">${btn('저금하기','cashDeposit()')}${btn('꺼내기','cashWithdraw()','line')}</div><p class="tiny-note">용돈과 저금통 사이에서만 돈이 이동하며 포인트와는 섞이지 않아요.</p>`)}`}
function cashOnlyPage(){return `<h2>💵 내 용돈 지갑</h2><div class="card walletHero"><div>사용할 수 있는 용돈</div><div class="big">${won(u.cash)}원</div><div class="muted" style="color:#eefcff">용돈만 표시해요 · 포인트와 저축은 별도 메뉴</div></div>${card(`<strong>💳 용돈 사용 기록</strong><label class="label">사용한 곳</label><input id="cashName" maxlength="40" class="field" placeholder="예: 문구점"><label class="label">금액 (원)</label><input id="cashAmount" type="number" class="field" min="1" placeholder="예: 1500">${btn('지출 기록하기','cashExpense()','full')}<p class="tiny-note">직접 입력하는 시연용 용돈 장부입니다.</p>${u.cashLogs.slice(0,20).map(x=>`<div class="itemline"><b>${esc(x.name)}</b><span style="float:right;color:${x.kind==='expense'?'#a85874':'#328d8a'}">${x.kind==='expense'?'-':'+'}${won(x.amount)}원</span><div class="muted">${esc(x.date)}</div></div>`).join('')||'<div class="empty">아직 용돈 기록이 없어요.</div>'}`)}${card(`<strong>🐷 저금통</strong><p class="muted">${won(u.cashSaved)}원 저축 중</p>${btn('저금통으로 이동',"go('piggy')",'alt full')}`)}`}
render=function(){if(removedGamePages.has(page))page='missions';renderBeforeV7();if(mode==='child'){
const tabs=[['home','🏠','홈'],['cash','💵','용돈'],['piggy','🐷','저금통'],['points','💜','포인트'],['missions','📚','미션'],['shop','🎁','포인트샵'],['talk','💬','가족대화']];
document.getElementById('nav').innerHTML=tabs.map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('');
const screen=document.getElementById('screen');
if(page==='piggy')screen.innerHTML=piggyPage();
if(page==='cash'||page==='wallet')screen.innerHTML=cashOnlyPage();
if(page==='home')screen.innerHTML=childHome().replace("go('cash')','alt full')","go('piggy')','alt full')").replace('오늘은 어떤 금융 모험을 할까? ✨','오늘도 알뜰하게 관리해 볼까? ✨');
if(page==='missions'){
const html=screen.innerHTML;screen.innerHTML=html.replace(/<div class="card"><strong>🎮 금융 체험 게임 15종<\/strong>[\s\S]*?<\/div>/g,'');
}
}
};

function roomScene(){let bg=ROOM_IMAGES[u.roomTheme]||ROOM_IMAGES.sunny;return `<div class="room-scene room-v8" style="background-image:url('${bg}')"><div class="room-soft-light"></div>${u.roomDecor.map(id=>{let p=roomPositions[id];if(!p)return '';return `<img class="room-furniture" alt="${esc(furnitureList.find(x=>x[0]===id)?.[2]||id)}" src="${MP_ASSET[id]}" style="left:${p[0]}%;top:${p[1]}%;width:${Math.max(15,p[2]*.7)}%;"/>`}).join('')}<img class="room-avatar" alt="내 캐릭터" src="${MP_AVATARS[s.avatar]||MP_AVATARS['🐻']}"/><div class="room-label">MY COZY ROOM ✨</div></div>`;}
function shopV5(){return `<h2>🎁 포인트샵</h2><div class="card pointsHero"><div>내 포인트</div><div class="big">${won(balance())} P</div></div><div class="sectionTitle">🎀 나만의 방 & 캐릭터</div>${card(`<strong>내 방 꾸미기</strong><p class="muted">그림 배경과 가구, 캐릭터를 골라 꾸며요.</p>${roomScene()}${btn('방 꾸미기 상점',"go('decorate')",'full')}`)}<div class="sectionTitle">🎟️ 기프티콘 교환</div><div class="notice">상품 이미지는 로고 및 일러스트로 표시됩니다. 이 프로토타입에서는 실제 기프티콘이나 코드가 발급되지 않아요.</div><div class="grid">${products.map(p=>`<div class="product reward-product"><div class="reward-art"><img src="${MP_REWARDS[p.id]}" alt="${esc(p.name)} 이미지"></div><strong>${esc(p.name)}</strong><div class="price">${won(p.price)} P</div>${btn('교환 신청',`buy('${p.id}')`,'alt full')}</div>`).join('')}</div>${card(`<strong>💌 포인트샵 소원함</strong>${btn('소원함 보기',"go('wishes')",'alt full')}`)}${card(`<strong>📦 교환 내역</strong>${s.orders.map(o=>`<div class="itemline">${esc(o.name.replace(/ 교환 체험/g,''))}<div class="muted">${esc(o.date)} · 신청 기록 (실제 발급 없음)</div></div>`).join('')||'<div class="empty">교환 내역이 없어요.</div>'}`)}`;}

buy=function(id){let p=products.find(x=>x.id===id);if(!p||balance()<p.price)return toast('교환할 포인트가 부족해요.');if(!confirm(p.name+'에 '+won(p.price)+'P를 사용할까요? 실제 상품은 발급되지 않습니다.'))return;s.spent+=p.price;s.orders.unshift({name:p.name,date:new Date().toLocaleDateString('ko-KR')});save();render();toast('교환 신청 내역에 추가했어요.');};

const mp10OldSetCashGoal=setCashGoal;
setCashGoal=function(){const nameInput=document.getElementById('cashGoalName');const amountInput=document.getElementById('cashGoal');if(!nameInput||!amountInput)return toast('목표 이름과 금액을 입력해 주세요.');const name=nameInput.value.trim();const amount=Number(amountInput.value);if(!name||name.length>35)return toast('목표 이름을 1~35자로 입력해 주세요.');if(!Number.isInteger(amount)||amount<1||amount>10000000)return toast('목표 금액을 확인해 주세요.');u.cashGoalName=name;u.cashGoal=amount;v5save();render();toast('저축 목표를 저장했어요.');};
piggyPage=function(){const pct=Math.min(100,Math.round(u.cashSaved/Math.max(1,u.cashGoal)*100));const goalName=esc(u.cashGoalName||'나의 저축 목표');return `<h2>🐷 나의 돼지 저금통</h2><p class="muted">용돈에서 조금씩 저축하며 목표를 달성해 보세요.</p><div class="card mp-goal-card"><div class="mp-goal-eyebrow">나의 저축 목표</div><div class="mp-goal-name">${goalName}</div><div class="mp-goal-amount">${won(u.cashGoal)}<span>원</span></div><div class="mp-goal-sep"></div>${pigSvg()}<div class="row"><b>${won(u.cashSaved)}원 모았어요</b><span class="pill">${pct}% 달성</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="row small"><span class="muted">목표까지 남은 금액</span><b>${won(Math.max(0,u.cashGoal-u.cashSaved))}원</b></div></div>${card(`<strong>🎯 저축 목표 정하기</strong><label class="label" for="cashGoalName">목표 이름</label><input id="cashGoalName" type="text" maxlength="35" class="field" value="${goalName}" placeholder="예: 새 자전거 사기"><label class="label" for="cashGoal">목표 금액 (원)</label><input id="cashGoal" type="number" min="1" max="10000000" class="field" value="${u.cashGoal}">${btn('목표 저장','setCashGoal()','alt full')}`)}${card(`<strong>💰 저금통에 돈 넣고 꺼내기</strong><p class="muted">용돈 지갑 잔액 ${won(u.cash)}원 · 저금통 잔액 ${won(u.cashSaved)}원</p><label class="label" for="cashSaveAmt">금액 (원)</label><input id="cashSaveAmt" type="number" min="1" class="field" placeholder="예: 1000"><div class="grid">${btn('저금하기','cashDeposit()')}${btn('꺼내기','cashWithdraw()','line')}</div><p class="tiny-note">용돈과 저금통 사이에서만 돈이 이동하며 포인트와는 섞이지 않아요.</p>`)}`};
const mp10OldPointsPage=pointsPage;
pointsPage=function(){const valid=s.logs.filter(l=>l&&Number.isFinite(Number(l.amount))&&Number(l.amount)>0&&!/^v4\s*활동\s*:/i.test(String(l.text||''))&&!/^v4\s*activity/i.test(String(l.text||'')));const history=valid.slice(0,35).map(l=>`<div class="itemline"><div class="row"><strong>${esc(l.text)}</strong><b style="color:#7954d6">+${won(l.amount)}P</b></div><div class="muted">${esc(l.date||'')}</div></div>`).join('')||'<div class="empty">아직 실제로 적립한 포인트 내역이 없어요.<br>금융 미션을 완료하거나 부모님 보상을 받아 보세요.</div>';return `<h2>💜 내 포인트</h2><div class="card pointsHero"><div>사용 가능한 포인트</div><div class="big">${won(balance())} P</div><div class="muted" style="color:#eee5ff">미션 보상 포인트 · 용돈과 분리</div></div><div class="grid"><div class="money-card"><div class="muted">총 적립</div><b>${won(s.earned)}P</b></div><div class="money-card"><div class="muted">총 사용</div><b>${won(s.spent)}P</b></div></div>${card(`<strong>🎁 포인트로 할 수 있는 일</strong><p class="small">포인트샵에서 기프티콘 교환을 신청하거나 방을 꾸밀 수 있어요.</p>${btn('포인트샵 가기',"go('shop')",'full')}`)}${card(`<strong>🐷 포인트 보관함</strong><p class="muted">보관 중인 포인트 ${won(s.saved)}P</p><input class="field" type="number" id="deposit" min="1" placeholder="옮길 포인트"><div class="grid">${btn('포인트 보관','deposit()')}${btn('포인트 꺼내기','withdraw()','line')}</div>`)}${card(`<strong>✨ 포인트 적립 내역</strong><p class="tiny-note">완료되어 기록된 활동만 표시합니다. 이전 개발용 활동 표기는 제외됩니다.</p>${history}`)}`};
const mp10OldShop=shopV5;
shopV5=function(){return mp10OldShop().replace('소원함 보기', '소원함 보기 · 신청 현황')};
function mp10Wishes(){const list=Array.isArray(v.wish)?v.wish:[];const approved=list.filter(x=>x.approved).length;return `<button class="back" onclick="go('shop')">← 포인트샵으로</button><h2>💌 포인트샵 소원함</h2><p class="muted">사고 싶은 상품을 등록하고 부모님에게 승인을 요청해 보세요.</p><div class="card"><div class="row"><strong>나의 소원</strong><span class="pill">${list.length}개 · 승인 ${approved}개</span></div><div class="mp-wish-stats"><span>⏳ 승인 대기 ${list.length-approved}개</span><span>💜 내 포인트 ${won(balance())}P</span></div></div>${mode==='child'?card(`<strong>✨ 새로운 소원 등록</strong><label class="label" for="wishName">갖고 싶은 상품 이름</label><input class="field" id="wishName" maxlength="50" placeholder="예: 아이스크림 기프티콘"><label class="label" for="wishPoints">필요한 포인트</label><input class="field" id="wishPoints" type="number" min="1" max="1000000" placeholder="예: 2500">${btn('소원함에 추가','addWish()','full')}`):card(`<strong>👨‍👩‍👧 부모님 승인 관리</strong><p class="muted">아이의 소원 목록을 확인하고 승인할 수 있어요. 승인은 상품 구매나 포인트 차감을 뜻하지 않아요.</p>`)}<div class="sectionTitle">📋 소원 목록</div>${list.length?list.map(x=>card(`<div class="row"><strong>${esc(x.name)}</strong><span class="pill">${x.approved?'승인 완료':'승인 대기'}</span></div><div class="row small"><span class="muted">필요 포인트</span><b>${won(x.points)} P</b></div>${mode==='parent'&&!x.approved?btn('이 소원 승인하기',`approveWish(${Number(x.id)})`,'full'):''}${mode==='child'&&!x.approved?'<p class="tiny-note">부모님 모드에서 승인할 수 있어요.</p>':''}${mode==='child'&&x.approved?btn('포인트샵으로 이동',"go('shop')",'alt full'):''}${mode==='child'?btn('소원 삭제',`mp10DeleteWish(${Number(x.id)})`,'line full'):''}`)).join(''):'<div class="card empty">아직 등록된 소원이 없어요.</div>'}${mode==='child'?card(`<strong>👨‍👩‍👧 부모님 승인 방법</strong><p class="small">① 소원 등록 → ② 화면 위쪽의 부모 모드로 전환 → ③ 포인트샵 소원함 열기 → ④ 승인 버튼 누르기</p>`):''}`;}
function mp10DeleteWish(id){const idx=v.wish.findIndex(x=>x.id===id);if(idx<0)return;if(!confirm('이 소원을 삭제할까요?'))return;v.wish.splice(idx,1);v4save();render();}
const mp10OldRender=render;
render=function(){mp10OldRender();const screen=document.getElementById('screen');if(page==='wishes'){screen.innerHTML=mp10Wishes();}if(mode==='parent'){const nav=document.getElementById('nav');if(!nav.querySelector('[data-mp-wishes]'))nav.insertAdjacentHTML('beforeend',`<button data-mp-wishes class="${page==='wishes'?'active':''}" onclick="go('wishes')"><span>💌</span>소원함</button>`);if(page==='shop')screen.insertAdjacentHTML('beforeend',card(`<strong>💌 자녀의 포인트샵 소원함</strong>${btn('소원함 승인 관리',"go('wishes')",'full')}`));}if(mode==='child'&&page==='home'){const old=screen.innerHTML;screen.innerHTML=old.replace(/<strong>🐷 나의 돼지 저금통<\/strong>/,'<strong>🐷 '+esc(u.cashGoalName||'나의 저축 목표')+'</strong>');}}
render();

<script>
/* v14 - simulated children's card: no real issuing or payments */
(function(){
 const KEY14='money_play_v14_card';
 const base={issued:false,alias:'나의 머니카드',theme:'purple',last4:'',createdAt:''};
 let c14;
 try{c14={...base,...JSON.parse(localStorage.getItem(KEY14)||'{}')}}catch(e){c14={...base}}
 const persist=()=>localStorage.setItem(KEY14,JSON.stringify(c14));
 const cardLogs=()=>Array.isArray(u.cashLogs)?u.cashLogs.filter(x=>x.kind==='expense'&&x.method==='card'):[];
 const monthKey=()=>new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
 const thisMonth=()=>cardLogs().filter(x=>x.monthKey===monthKey()).reduce((a,x)=>a+Number(x.amount||0),0);
 const cardArt=()=>`<div class="mp14-bankcard ${c14.theme==='purple'?'':c14.theme}"><div class="mp14-bank-top"><span>💜 MONEY PLAY</span><span>CHILD CARD · DEMO</span></div><div class="mp14-chip"></div><div class="mp14-cardnumber">•••• •••• •••• ${esc(c14.last4)}</div><div class="mp14-card-bottom"><span>${esc(mp12Profile.name||'어린이')}<br>${esc(c14.alias)}</span><span>✦ MONEY</span></div></div>`;
 const stats=()=>`<div class="mp14-stats"><div class="mp14-stat"><span>사용 가능 용돈</span><b>${won(u.cash)}원</b></div><div class="mp14-stat"><span>이번 달 카드 사용</span><b>${won(thisMonth())}원</b></div></div>`;
 const recent=()=>cardLogs().slice(0,12).map(x=>`<div class="mp14-entry"><div><strong>${esc(x.name)}</strong><small>${esc(x.date||'')} · 카드 사용 기록</small></div><b>−${won(x.amount)}원</b></div>`).join('')||'<p class="muted">아직 카드 사용 기록이 없어요.</p>';
 const demo=()=>'<div class="mp14-demo">안내: 이 카드는 앱 안에서만 사용하는 교육용 가상 카드예요. 실제 카드 번호, 계좌, 결제 기능은 제공하지 않으며 매장 결제도 불가능해요.</div>';
 function homeCard(){return `<section class="card" id="mp14-home-card"><div class="row"><strong>💳 나의 머니카드</strong><span class="pill">${c14.issued?'발급 완료 · 시연용':'발급 전'}</span></div>${c14.issued?cardArt()+stats()+btn('카드 자세히 보기',"go('mycard')",'alt full'):`<p class="muted">나만의 카드 디자인을 골라 만들어 보세요. 실제 발급이 아닌 앱 체험용이에요.</p>${btn('나의 카드 만들기',"go('mycard')",'full')}`}</section>`}
 function cardPage(){return `<h2>💳 나의 머니카드</h2>${c14.issued?`${cardArt()}${stats()}${demo()}${card(`<strong>🛍️ 카드 사용 기록하기</strong><p class="muted">앱에서 가상으로 결제한 내역을 등록해요. 기록한 금액은 용돈 잔액에서 차감되고 부모님 카드내역에도 나타나요.</p><label class="label" for="mp14Merchant">사용한 곳</label><input class="field" id="mp14Merchant" maxlength="40" placeholder="예: 동네 문구점"><label class="label" for="mp14Amount">사용 금액 (원)</label><input class="field" id="mp14Amount" type="number" min="1" placeholder="예: 2500">${btn('가상 카드 사용 기록하기','mp14Pay()','full')}`)}${card(`<div class="row"><strong>🧾 최근 카드 사용 내역</strong><span class="pill">${cardLogs().length}건</span></div>${recent()}`)}${card(`<strong>🎨 카드 꾸미기</strong><label class="label" for="mp14Alias">카드 별명</label><input class="field" id="mp14Alias" maxlength="18" value="${esc(c14.alias)}"><div class="mp14-color-choices">${[['purple','보라'],['pink','분홍'],['mint','민트'],['night','네이비']].map(([v,n])=>`<label><input type="radio" name="mp14Theme" value="${v}" ${c14.theme===v?'checked':''}> ${n}</label>`).join('')}</div>${btn('디자인 저장','mp14Style()','alt full')}`)}`:`${card(`<strong>✨ 내 카드 만들기</strong><p class="muted">카드 별명과 색상을 골라 나만의 금융 학습용 카드를 만들어 봐요.</p><label class="label" for="mp14Alias">카드 별명</label><input class="field" id="mp14Alias" maxlength="18" value="나의 머니카드"><div class="mp14-color-choices">${[['purple','보라'],['pink','분홍'],['mint','민트'],['night','네이비']].map(([v,n])=>`<label><input type="radio" name="mp14Theme" value="${v}" ${v==='purple'?'checked':''}> ${n}</label>`).join('')}</div>${demo()}${btn('가상 카드 발급하기','mp14Issue()','full')}`)}`}`}
 window.mp14Issue=function(){if(c14.issued)return;const a=document.getElementById('mp14Alias');const name=a?.value.trim();if(!name||name.length>18)return toast('카드 별명을 입력해 주세요.');c14.issued=true;c14.alias=name;c14.theme=document.querySelector('input[name="mp14Theme"]:checked')?.value||'purple';c14.last4=String(Math.floor(1000+Math.random()*9000));c14.createdAt=new Date().toISOString();persist();render();toast('체험용 머니카드를 만들었어요!')};
 window.mp14Style=function(){if(!c14.issued)return;const name=document.getElementById('mp14Alias')?.value.trim();if(!name||name.length>18)return toast('카드 별명을 입력해 주세요.');c14.alias=name;c14.theme=document.querySelector('input[name="mp14Theme"]:checked')?.value||'purple';persist();render();toast('카드 디자인을 저장했어요!')};
 window.mp14Pay=function(){if(!c14.issued)return toast('먼저 카드를 만들어 주세요.');const name=document.getElementById('mp14Merchant')?.value.trim();const amount=Number(document.getElementById('mp14Amount')?.value);if(!name||!Number.isSafeInteger(amount)||amount<1||amount>1000000)return toast('사용처와 금액을 확인해 주세요.');if(amount>u.cash)return toast('용돈 잔액이 부족해요.');if(!confirm(`${name}에서 ${won(amount)}원을 가상 카드 사용 내역으로 기록할까요? 실제 결제는 발생하지 않아요.`))return;const now=new Date();const date=now.toLocaleDateString('ko-KR');u.cash-=amount;u.cashLogs.unshift({id:Date.now(),name:name.slice(0,40),amount,kind:'expense',method:'card',monthKey:monthKey(),date});if(!Array.isArray(s.transactions))s.transactions=[];s.transactions.unshift({id:Date.now()+1,name:name.slice(0,40),amount,date,emoji:'💳',comments:[]});v5save();save();render();toast('가상 카드 사용 내역을 기록했어요!')};
 const oldGo=go;go=function(p){if(p==='mycard'){page='mycard';chosen=-1;render();window.scrollTo(0,0);return;}oldGo(p)};
 const oldRender=render;render=function(){oldRender();const screen=document.getElementById('screen');if(!screen)return;if(page==='mycard'&&mode==='child'){screen.innerHTML=cardPage();const nav=document.getElementById('nav');nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));}else if(page==='home'&&mode==='child'){screen.querySelector('#mp14-home-card')?.remove();const profile=screen.querySelector('.mp12-profile');if(profile)profile.insertAdjacentHTML('afterend',homeCard());else screen.insertAdjacentHTML('afterbegin',homeCard());}};
 render();
})();
