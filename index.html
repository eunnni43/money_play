<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#654de6"><title>MONEY PLAY v4</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#20223a;background:#eae9f5}*{box-sizing:border-box}body{margin:0}.app{max-width:440px;margin:auto;min-height:100dvh;background:#f7f7fd;box-shadow:0 10px 50px #34316b18;padding:0 19px 108px}.top{padding:24px 0 15px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:950;letter-spacing:-1.2px;color:#5944d8}.sub{font-size:12px;color:#8b8aa5}.switch{border:1px solid #e4e1fa;background:white;color:#6351c5;padding:10px 12px;border-radius:30px;font-size:12px;font-weight:800}.screen h2{font-size:23px;letter-spacing:-.8px;margin:8px 0 15px}.muted{color:#9291a7;font-size:12px;line-height:1.6}.card{background:#fff;border:1px solid #efedf9;border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 7px 24px #47407b09}.hero{background:linear-gradient(135deg,#7358ed,#9e81ff);color:white;border:0;position:relative;overflow:hidden;padding:22px}.hero .muted{color:#e6e0ff}.hero .big{font-size:32px;font-weight:900;letter-spacing:-1px;margin:9px 0}.hero:after{content:'✦';position:absolute;right:19px;top:16px;font-size:62px;color:#ffffff30}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:13px}.big{font-size:27px;font-weight:900}.pill{display:inline-flex;border-radius:30px;background:#f0ecff;color:#7159d5;padding:6px 10px;font-size:11px;font-weight:800}.tag{background:#f3f5fc;padding:5px 8px;border-radius:8px;color:#77758e;font-size:11px}.btn{background:#6751e9;border:0;border-radius:14px;color:white;font-weight:850;padding:12px 15px;cursor:pointer;font:inherit;font-size:13px}.btn.alt{background:#f0edff;color:#6751df}.btn.line{background:white;border:1px solid #e3e0f4;color:#6453c3}.btn:disabled{opacity:.45}.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:white;border:1px solid #eeeaf9;border-radius:19px;padding:17px 12px;text-align:left;cursor:pointer;min-height:112px}.tile .emoji{font-size:29px;display:block;margin-bottom:9px}.tile strong{font-size:13px}.tile .muted{display:block;margin-top:4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid #efedf9;display:flex;justify-content:space-around;padding:10px 3px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#aaa6bd;font-size:10px;font-weight:750;padding:5px 1px;min-width:55px;cursor:pointer}.nav button span{display:block;font-size:22px;margin-bottom:3px}.nav button.active{color:#6b51e7}.sectionTitle{font-weight:900;font-size:16px;margin:22px 0 10px}.progress{height:10px;background:#eeebfb;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#7961eb;border-radius:20px}.field{width:100%;padding:13px;border:1px solid #e5e3f0;border-radius:13px;background:#fcfcff;font:inherit;font-size:14px;margin:7px 0 10px;outline-color:#8069e9}.label{font-size:12px;color:#78768e;font-weight:800}.record{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #f1eff8}.record:last-child{border:0}.record .bubble{width:43px;height:43px;background:#f3f0ff;display:grid;place-items:center;border-radius:15px;font-size:21px;flex-shrink:0}.record .details{flex:1;min-width:0}.record strong{font-size:13px}.record .amount{font-weight:850;font-size:14px;white-space:nowrap}.notice{font-size:11px;line-height:1.65;background:#f1f0fc;color:#79738f;border-radius:13px;padding:12px;margin:12px 0}.product{border:1px solid #efecfa;background:#fff;border-radius:20px;padding:14px}.product .picture{height:90px;border-radius:15px;display:grid;place-items:center;font-size:42px;background:linear-gradient(145deg,#ede7ff,#faf0ff);margin-bottom:11px}.product strong{font-size:13px;display:block;min-height:35px}.product .price{font-size:15px;font-weight:900;color:#6d52df;margin:7px 0}.product .btn{width:100%}.comment{background:#f5f3ff;border-radius:13px;padding:11px;margin:9px 0;font-size:12px;line-height:1.6}.question{font-size:17px;font-weight:900;line-height:1.5}.choice{display:block;text-align:left;width:100%;background:#f6f5fd;border:1px solid #ebe8f8;color:#302e48;padding:14px;border-radius:14px;margin:8px 0;font-size:13px;cursor:pointer}.choice.chosen{border-color:#7358ed;background:#eeeaff}.back{background:none;border:0;color:#7560d9;font-size:13px;padding:8px 0;cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f0edff;border-radius:20px;padding:7px 11px;font-size:12px;color:#6953cb}.empty{text-align:center;padding:28px 8px;color:#9290a7;font-size:13px}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);max-width:390px;width:90%;background:#28233c;color:#fff;border-radius:15px;padding:13px;text-align:center;font-size:13px;z-index:20;display:none}.itemline{padding:12px 0;border-bottom:1px solid #f0edf8;font-size:13px}.itemline:last-child{border:0}@media(min-width:700px){.app{margin-top:20px;border-radius:30px 30px 0 0;min-height:calc(100dvh - 20px)}}
.avatarPreview{text-align:center;padding:18px;background:linear-gradient(140deg,#f4ecff,#e8f9ff);border-radius:19px;margin-bottom:14px}.nav{overflow-x:auto;justify-content:space-between}.nav button{min-width:57px;flex:1} .tile.selected{border:2px solid #795de8;background:#f0eaff}.nav{gap:3px}.nav button{min-width:57px} </style></head><body><div class="app"><div class="top"><div><div class="sub">우리 가족 금융 놀이터 ✨</div><div class="brand">💜 MONEY PLAY</div></div><button class="switch" id="mode" onclick="toggleMode()">👨‍👩‍👧 부모 모드</button></div><main class="screen" id="screen"></main></div><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div><script>
const KEY='money_play_v3_demo';const defaultState={fund:10000,earned:0,spent:0,saved:0,goal:20000,done:[],talks:0,transactions:[{id:1,name:'학교 앞 문구점',amount:2500,date:'11.10',emoji:'✏️',comments:[]},{id:2,name:'편의점 간식',amount:3500,date:'11.09',emoji:'🍪',comments:[]}],rewards:[],orders:[],logs:[],plan:3000,avatar:'🐻',ownedAvatars:['🐻'],room:'🏡',ownedRooms:['🏡'],journey:[],scenarioDone:[],approvedOrders:[],familyNotes:[]};let s;try{s=Object.assign({},defaultState,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){s=structuredClone(defaultState)};let mode='child',page='home',quiz=0,chosen=-1,activeTx=1;const areas=[['💵','가계재무관리','용돈 10,000원 중 준비물 4,000원이 필요해요. 어떻게 할까요?',['준비물 예산을 먼저 남겨둔다','오늘 전부 사용한다','계획을 세우지 않는다'],0,'필요한 지출을 먼저 고려해 예산을 세워요.'],['🐷','자산관리','매주 2,000원씩 5주 동안 저축하면?',['5,000원','10,000원','20,000원'],1,'2,000원씩 5번 모으면 10,000원이에요.'],['🤝','신용관리','친구에게 빌린 돈을 제때 갚기 어렵다면?',['아무 말도 하지 않는다','미리 설명하고 상의한다','연락을 피한다'],1,'상황을 솔직하게 설명하고 약속을 지키기 위해 노력해요.'],['🛡️','위험관리','갑자기 준비물 구입비가 생겼어요.',['비상 예산을 확인한다','다른 사람 돈을 몰래 쓴다','아무것도 하지 않는다'],0,'예상하지 못한 지출을 위해 일부를 남겨두면 좋아요.'],['🔐','금융활용','모르는 사람이 카드 비밀번호를 물어봐요.',['알려준다','사진을 보낸다','알려주지 않고 보호자에게 알린다'],2,'비밀번호와 개인정보를 안전하게 지켜야 해요.'],['🎯','생애재무설계','3개월 뒤 원하는 물건을 사고 싶다면?',['금액과 기간을 정해 계획한다','계획 없이 기다린다','돈을 전부 쓴다'],0,'목표를 세우고 꾸준히 준비하는 습관이 중요해요.']];const products=[{id:'roblox',emoji:'🎮',name:'로블록스 기프트카드 교환 체험',price:5000},{id:'ice',emoji:'🍦',name:'아이스크림 기프티콘 교환 체험',price:2500},{id:'cafe',emoji:'🥤',name:'음료 기프티콘 교환 체험',price:3500},{id:'movie',emoji:'🎬',name:'영화 관람권 교환 체험',price:7000}];const won=n=>Math.max(0,Number(n)||0).toLocaleString('ko-KR');const balance=()=>s.earned-s.spent-s.saved;const remain=()=>s.fund-s.earned;const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=x=>`<div class="card">${x}</div>`;const btn=(text,action,cl='')=>`<button class="btn ${cl}" onclick="${action}">${text}</button>`;function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>el.style.display='none',2600)}function go(p){page=p;chosen=-1;render();window.scrollTo(0,0)}function toggleMode(){mode=mode==='child'?'parent':'child';go('home')};function reward(n,why){if(remain()<n){toast('부모 보상 예산이 부족해요.');return false}s.earned+=n;s.logs.unshift({text:why,amount:n,date:new Date().toLocaleDateString('ko-KR')});save();return true}function render(){document.getElementById('mode').textContent=mode==='child'?'👨‍👩‍👧 부모 모드':'🧒 어린이 모드';const tabs=mode==='child'?[['home','🏠','홈'],['missions','🎮','미션'],['wallet','💜','지갑'],['shop','🎁','포인트샵'],['talk','💬','대화'],['decorate','🎨','꾸미기']]:[['home','🏠','홈'],['charge','💳','충전'],['cards','🧾','카드내역'],['coach','💬','코칭'],['talk','👪','대화'],['insights','📊','교육']];document.getElementById('nav').innerHTML=tabs.map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('');let h='';if(page==='home'){h=mode==='child'?`<h2>안녕! 오늘도 즐겁게 👋</h2><div class="card hero"><div class="small">내가 사용할 수 있는 포인트</div><div class="big">${won(balance())} P</div><div class="muted">미션으로 모은 나만의 보상 포인트</div></div><div class="grid"><button class="tile" onclick="go('missions')"><span class="emoji">🎮</span><strong>금융 미션</strong><span class="muted">6가지 역량 도전</span></button><button class="tile" onclick="go('shop')"><span class="emoji">🎁</span><strong>포인트샵</strong><span class="muted">보상 교환 체험</span></button></div>${card(`<div class="row"><strong>🐷 나만의 저금통</strong><span class="pill">${Math.min(100,Math.round(s.saved/s.goal*100))}% 달성</span></div><div class="progress"><div style="width:${Math.min(100,s.saved/s.goal*100)}%"></div></div><div class="row small"><b>${won(s.saved)}P</b><span class="muted">목표 ${won(s.goal)}P</span></div>${btn('저금통 관리','go(\'wallet\')','alt full')}`)}${card(`<div class="row"><strong>💌 부모님의 카드 코멘트</strong><span class="tag">${s.transactions.reduce((n,t)=>n+t.comments.length,0)}개</span></div>${s.transactions.filter(t=>t.comments.length).slice(0,2).map(t=>`<div class="comment"><b>${esc(t.name)}</b><br>${esc(t.comments[t.comments.length-1])}</div>`).join('')||'<p class="muted">아직 부모님의 코멘트가 없어요.</p>'}`)}${card(`<strong>🧾 내 카드 결제 내역</strong>${txList(false)}${btn('결제 내역 보기','go(\'cards\')','alt full')}`)}`:`<h2>부모님 대시보드 👨‍👩‍👧</h2><div class="card hero"><div class="small">남은 미션 보상 예산</div><div class="big">${won(remain())} P</div><div class="muted">충전 설정 ${won(s.fund)}P · 지급 ${won(s.earned)}P</div></div><div class="grid"><button class="tile" onclick="go('charge')"><span class="emoji">💳</span><strong>포인트 충전</strong><span class="muted">보상 예산 추가</span></button><button class="tile" onclick="go('cards')"><span class="emoji">🧾</span><strong>카드 결제 내역</strong><span class="muted">결제별 코멘트</span></button></div>${card(`<div class="row"><strong>🎓 금융역량 학습</strong><span class="pill">${s.done.length}/6 완료</span></div><div class="progress"><div style="width:${s.done.length/6*100}%"></div></div><div class="chips">${areas.map((a,i)=>`<span class="chip">${a[0]} ${s.done.includes(i)?'✓':''}</span>`).join('')}</div>`)}${card(`<strong>💬 최근 카드 결제</strong>${txList(false)}${btn('소비 코칭하기','go(\'cards\')','alt full')}`)}`}
if(page==='missions'){h=`<h2>🎮 금융 탐험 미션</h2><p class="muted">6대 금융역량을 배워요! 각 미션을 처음 완료하면 1,000P를 받아요.</p><div class="grid">${areas.map((a,i)=>`<button class="tile" onclick="quiz=${i};go('quiz')"><span class="emoji">${a[0]}</span><strong>${a[1]}</strong><span class="muted">${s.done.includes(i)?'✅ 학습 완료':'✨ 도전하기'}</span></button>`).join('')}</div>${card(`<strong>🧭 생활 속 금융 선택 게임</strong><p class="muted">실제 인터뷰에서 나온 가격 비교·과소비·돈 지키기 상황을 연습해요.</p>${btn('상황 게임 시작','go(\'scenario\')','full')}`)}`}if(page==='quiz'){let a=areas[quiz];h=`<button class="back" onclick="go('missions')">← 미션 목록</button>${card(`<span class="pill">${a[0]} ${a[1]}</span><p class="question">${a[2]}</p>${a[3].map((v,i)=>`<button class="choice ${chosen===i?'chosen':''}" onclick="chosen=${i};render()">${i+1}. ${v}</button>`).join('')}${btn('정답 확인','answer()','full')}`)}`}
if(page==='wallet'){h=`<h2>💜 내 포인트 지갑</h2><div class="card hero"><div>사용 가능 포인트</div><div class="big">${won(balance())} P</div><div class="muted">적립 ${won(s.earned)}P · 교환 ${won(s.spent)}P · 저축 ${won(s.saved)}P</div></div>${card(`<strong>🐷 목표 저금통</strong><div class="progress"><div style="width:${Math.min(100,s.saved/s.goal*100)}%"></div></div><div class="row small"><b>${won(s.saved)}P</b><span>목표 ${won(s.goal)}P</span></div><label class="label">목표 포인트</label><input class="field" id="goal" type="number" min="1" value="${s.goal}">${btn('목표 변경','setGoal()','alt')}<label class="label" style="display:block;margin-top:12px">저축할 포인트</label><input class="field" id="deposit" type="number" min="1" placeholder="예: 500"><div class="row">${btn('저금통에 넣기','deposit()')}${btn('저금통에서 꺼내기','withdraw()','line')}</div>`)}${card(`<strong>✨ 포인트 적립 내역</strong>${s.logs.map(l=>`<div class="itemline">${esc(l.text)} <b style="float:right">+${won(l.amount)}P</b><div class="muted">${esc(l.date)}</div></div>`).join('')||'<div class="empty">미션을 완료하고 포인트를 모아보세요!</div>'}`)}${card(`<strong>🧾 카드 결제 내역</strong>${txList(false)}`)}`}
if(page==='shop'){h=`<h2>🎁 포인트샵</h2><div class="card hero"><div>내 쇼핑 가능 포인트</div><div class="big">${won(balance())} P</div><div class="muted">금융 미션을 완료해 포인트를 모아봐요!</div></div><div class="notice">시연용 상품입니다. 로블록스 크레딧, 기프트카드, 기프티콘 등 실제 상품이나 코드는 발급되지 않습니다. 실제 운영 시 공급사 제휴와 부모 승인 절차가 필요합니다.</div><div class="grid">${products.map(p=>`<div class="product"><div class="picture">${p.emoji}</div><strong>${p.name}</strong><div class="price">${won(p.price)} P</div>${btn('교환 신청',`buy('${p.id}')`,'alt')}</div>`).join('')}</div>${card(`<strong>📦 내 교환 신청 내역</strong>${s.orders.map(o=>`<div class="itemline">${esc(o.name)}<div class="muted">${esc(o.date)} · 시연용 교환 완료 (실제 발급 없음)</div></div>`).join('')||'<div class="empty">아직 교환 신청이 없어요.</div>'}`)}`}
if(page==='charge'){h=`<h2>💳 부모 포인트 충전</h2><div class="card hero"><div>남은 보상 예산</div><div class="big">${won(remain())} P</div><div class="muted">누적 등록 ${won(s.fund)}P · 미션 지급 ${won(s.earned)}P</div></div>${card(`<strong>충전할 포인트 선택</strong><div class="chips" style="margin:13px 0">${[1000,5000,10000,20000].map(n=>`<button class="btn alt" onclick="document.getElementById('chargeAmt').value=${n}">${won(n)}P</button>`).join('')}</div><label class="label">추가할 포인트</label><input id="chargeAmt" class="field" type="number" min="1" max="100000" value="10000">${btn('포인트 충전 시연하기','charge()','full')}<p class="notice">실제 카드 결제나 현금 이체는 발생하지 않습니다. 부모가 보상 예산을 등록하는 가상 충전입니다. 실제 서비스에서는 결제사업자 제휴 및 관련 법률 검토가 필요합니다.</p>`)}${card(`<strong>⚙️ 보상 정책</strong><div class="itemline">금융역량 미션 최초 완료 <b style="float:right">1,000P</b></div><div class="itemline">가족 금융 대화 완료 <b style="float:right">500P</b></div><div class="itemline">포인트샵 교환 <b style="float:right">자녀 적립 포인트 차감</b></div>`)}${card(`<strong>👪 부모 교육 가이드</strong><p class="small">용돈을 줄 때: 필요한 지출과 원하는 지출을 함께 구분해 보세요.</p><p class="small">예산을 초과했을 때: 혼내기보다 선택한 이유를 먼저 물어보세요.</p><p class="small">금융 대화: 정답을 말해주기보다 아이의 생각을 들어보세요.</p>`)}`}

function txList(all){return s.transactions.slice(0,all?99:3).map(t=>`<div class="record"><div class="bubble">${esc(t.emoji)}</div><div class="details"><strong>${esc(t.name)}</strong><div class="muted">${esc(t.date)} · 코멘트 ${t.comments.length}개</div></div><span class="amount">-${won(t.amount)}원</span></div>`).join('')||'<div class="empty">결제 내역이 없어요.</div>'}function answer(){let a=areas[quiz];if(chosen<0)return toast('답을 하나 선택해 주세요.');if(chosen!==a[4])return toast('다시 생각해 봐요! '+a[5]);if(!s.done.includes(quiz)){s.done.push(quiz);if(reward(1000,a[1]+' 미션 완료'))toast('정답! 1,000P 적립 완료 ✨');else toast('정답! 보상 예산 부족으로 포인트는 지급되지 않았어요.');save()}else toast('정답! 이미 완료한 미션이에요.');go('missions')}function charge(){let n=Number(document.getElementById('chargeAmt').value);if(!Number.isInteger(n)||n<1||n>100000)return toast('1~100,000P 사이로 입력해 주세요.');s.fund+=n;save();render();toast(won(n)+'P 가상 충전 완료!')}function buy(id){let p=products.find(x=>x.id===id);if(!p||balance()<p.price)return toast('교환할 포인트가 부족해요.');if(!confirm(p.name+'에 '+won(p.price)+'P를 사용해 시연용 교환을 진행할까요? 실제 상품은 발급되지 않습니다.'))return;s.spent+=p.price;s.orders.unshift({name:p.name,date:new Date().toLocaleDateString('ko-KR')});save();render();toast('교환 체험 완료! 실제 상품 발급은 없어요.')}function addTx(){let name=document.getElementById('merchant').value.trim(),amount=Number(document.getElementById('txAmount').value);if(!name||!Number.isInteger(amount)||amount<=0||amount>10000000)return toast('가맹점과 올바른 결제 금액을 입력해 주세요.');s.transactions.unshift({id:Date.now(),name:name.slice(0,40),amount,date:new Date().toLocaleDateString('ko-KR'),emoji:'💳',comments:[]});save();render();toast('시연용 결제 내역을 추가했어요.')}function addTxComment(id){let el=document.getElementById('comment'+id),c=el&&el.value.trim(),t=s.transactions.find(x=>x.id===id);if(!c||!t)return toast('코멘트를 입력해 주세요.');t.comments.push(c.slice(0,300));save();render();toast('부모님 코멘트를 남겼어요.')}function setGoal(){let n=Number(document.getElementById('goal').value);if(!Number.isInteger(n)||n<1||n>100000 if(page==='aicoach'){let prompts=[['간식에 5,000원을 쓰고 싶어요.','이번 주에 꼭 필요한 지출이 있는지 먼저 살펴볼까요?'],['친구에게 돈을 빌려도 될까요?','돈을 빌리기 전에 다른 방법과 갚을 계획을 생각해 볼까요?'],['선물을 사고 싶어요.','목표 금액과 남은 기간을 정해 저축 계획을 세워볼까요?'],['게임 아이템이 너무 사고 싶어요.','지금 사는 선택과 조금 기다리는 선택을 비교해 볼까요?']];h=`<h2>🤖 AI 소비 코치 체험</h2><div class="notice">이 버전은 실제 생성형 AI가 아니라 미리 설계한 질문 추천 방식이에요.</div>${v4card('상담 주제 선택',prompts.map(([q,a],i)=>btn(q,`coachAsk(${i})`,'alt full')).join('')+`<div id="coachResponse" class="comment">어떤 상황인지 선택해 보세요.</div>`)}${v.coachHistory.slice(-3).reverse().map(x=>v4card('나의 생각',`<p>${esc(x.q)}</p><p class="comment">${esc(x.a)}</p>`)).join('')}`}
if(page==='emergency'){h=`<h2>☔ 비상금 구조대</h2>${v4card('나의 가상 비상금',`<div class="big">${won(v.emergency)}원</div><p>갑자기 학교 준비물 1,500원이 필요해졌어요.</p>${btn('비상금으로 준비물 구매','emergencyChoice(true)','full')}${btn('비상금을 모두 간식에 사용','emergencyChoice(false)','alt full')}<p class="muted">비상금은 가상 시뮬레이션 전용이에요.</p>`)}`}
if(page==='letters'){h=`<h2>💌 부모님 금융 미션 편지</h2>${mode==='parent'?v4card('자녀에게 미션 보내기',`<input class="field" id="letterText" maxlength="160" placeholder="예: 이번 주 필요한 물건 3개 적어보기"><label class="label">완료 보상(P)</label><input class="field" id="letterPoints" type="number" value="200">${btn('미션 편지 보내기','sendLetter()','full')}`):'<p class="muted">부모님이 보낸 금융 미션을 확인하고 완료해 보세요.</p>'}${v.letters.slice().reverse().map(x=>v4card('💌 '+esc(x.text),`<p class="muted">보상 ${won(x.points)}P · ${x.done?'완료':'진행 중'}</p>${mode==='child'&&!x.done?btn('미션 완료 요청',`requestLetter(${x.id})`,'full'):mode==='parent'&&x.requested&&!x.done?btn('완료 승인·포인트 지급',`approveLetter(${x.id})`,'full'):''}`)).join('')}`}
if(page==='coop'){h=`<h2>🤝 친구 금융 협동</h2>${v4notice}${v4card('협동 장보기 챌린지',`<p>친구와 함께 가상의 소풍 예산 8,000원으로 준비물을 골라봐요.</p><p class="muted">친구 연결 없이 한 기기에서 역할을 바꾸는 시연 모드입니다.</p><label class="label">내가 고른 물건</label><select class="field" id="coopA"><option value="2500">샌드위치 2,500원</option><option value="4500">도시락 4,500원</option></select><label class="label">친구가 고른 물건</label><select class="field" id="coopB"><option value="2000">과일 2,000원</option><option value="4000">과자 세트 4,000원</option></select>${btn('함께 예산 계산하기','finishCoop()','full')}`)}${v.coop.slice(-2).map(x=>v4card('협동 기록',`합계 ${won(x.total)}원 · ${x.ok?'예산 성공':'예산 초과'}`)).join('')}`}
if(page==='pet'){let stage=v.petXP>=12?'🌟 성장한 머니펫':v.petXP>=5?'🐹 활발한 머니펫':'🐣 아기 머니펫';h=`<h2>🐹 머니펫 키우기</h2>${v4card(stage,`<div class="avatarPreview" style="font-size:82px">${v.petXP>=12?'🐹':v.petXP>=5?'🐭':'🐣'}</div><div class="progress"><div style="width:${Math.min(100,v.petXP/12*100)}%"></div></div><p class="muted">금융 활동을 완료하면 성장 경험치가 쌓여요. ${v.petXP}/12 XP</p>${btn('금융 놀이터에서 미션하기','go(\'play\')','full')}`)}`}
if(page==='wishes'){h=`<h2>🎟️ 포인트샵 소원함</h2>${v4card('희망 상품 등록',`<input class="field" id="wishName" maxlength="50" placeholder="예: 아이스크림 기프티콘"><input class="field" id="wishPoints" type="number" placeholder="필요한 포인트">${btn('소원함에 추가','addWish()','full')}`)}${v.wish.map(x=>v4card(esc(x.name),`<p>${won(x.points)}P · ${x.approved?'부모 승인':'부모 승인 대기'}</p>${mode==='parent'&&!x.approved?btn('상품 목표 승인',`approveWish(${x.id})`,'full'):''}${mode==='child'&&x.approved?btn('포인트샵으로 이동','go(\'shop\')','alt full'):''}`)).join('')}`}
if(page==='story'){let chapters=[['용돈 10,000원을 받았어요.','필요한 준비물 3,000원을 먼저 남겨둔다','모두 간식에 사용한다'],['친구가 돈을 빌려달라고 해요.','부모님과 상의하고 상황을 확인한다','아무 계획 없이 빌려준다'],['목표 물건이 할인 중이에요.','예산과 필요성을 확인한다','할인이라서 바로 구매한다']];let ch=chapters[v.story.length%chapters.length];h=`<h2>📖 나의 금융 인생 스토리</h2>${v4card('제 '+(v.story.length+1)+'장',`<p class="question">${ch[0]}</p>${btn(ch[1],`storyPick(0)`,'alt full')}${btn(ch[2],`storyPick(1)`,'alt full')}<p class="muted">선택에 따라 기록과 결말이 달라져요.</p>`)}${v.story.length?v4card('지금까지의 선택',`<p>계획적인 선택 ${v.story.filter(x=>x===0).length}회 / 즉흥적인 선택 ${v.story.filter(x=>x===1).length}회</p>${v.story.length>=3?'<p class="comment">이야기를 완주했어요! 다양한 선택을 비교해 보세요.</p>':''}`):''}`}
if(page==='map'){let counts=areas.map((a,i)=>Number(s.done.includes(i)) + v.v4Done.filter(k=>({0:['market','town','business'],1:['gift','wait','pet'],2:['coop','letters'],3:['emergency','detective'],4:['detective','aicoach'],5:['story','gift']}[i]||[]).includes(k)).length);h=`<h2>🗺️ 금융역량 성장 지도</h2>${v4card('6대 금융역량 탐험 섬',`<p class="muted">완료한 미션과 게임을 바탕으로 표시되는 학습 활동 지표예요.</p>${areas.map((a,i)=>`<div class="itemline"><strong>${a[0]} ${a[1]}</strong><span class="pill">${counts[i]} 활동</span><div class="progress"><div style="width:${Math.min(100,counts[i]*25)}%"></div></div></div>`).join('')}`)}`}
return h}
function visitTown(name,p){if(!v.townVisits.includes(name))v.townVisits.push(name);v4save();go(p)}
function toggleGood(i){let j=v.marketCart.indexOf(i);if(j>=0)v.marketCart.splice(j,1);else v.marketCart.push(i);v4save();render()}
function finishMarket(){let goods=[2500,2300,1200,1800,6500,2100],total=v.marketCart.reduce((a,i)=>a+goods[i],0);if([0,1,2,5].every(i=>v.marketCart.includes(i))&&total<=10000){v4reward('market')}else toast(total>10000?'예산을 초과했어요. 다시 골라봐요.':'필요한 4가지 물건을 모두 담아보세요.')}
function buyStock(){if(v.businessCash<1000)return toast('재료비가 부족해요.');v.businessCash-=1000;v.businessStock++;v4save();render()}
function sellStock(){if(v.businessStock<1)return toast('재료를 먼저 구매해요.');v.businessStock--;v.businessCash+=1600;v.businessSales++;v4save();render()}
function finishBusiness(){if(v.businessSales<2)return toast('컵케이크를 2개 이상 판매해 보세요.');v4reward('business')}
function buyAccessory(e,p){if(v.avatarAccessories.includes(e))return toast('이미 가지고 있어요.');if(balance()<p)return toast('포인트가 부족해요.');s.spent+=p;v.avatarAccessories.push(e);v4save();render()}
function detectiveAnswer(answer,right){if(answer!==right)return toast('다시 생각해 봐요. 안전과 약속을 먼저 확인해요.');v.detective++;v4save();if(v.detective>=3)v4reward('detective');else {render();toast('사건 해결! 다음 사건으로 이동했어요.')}}
function addGift(){let n=document.getElementById('giftName').value.trim(),p=+document.getElementById('giftPrice').value,w=+document.getElementById('giftWeeks').value;if(!n||!Number.isInteger(p)||p<1||p>10000000||!Number.isInteger(w)||w<1||w>104)return toast('목표·금액·기간을 확인해 주세요.');v.giftGoals.unshift({name:n.slice(0,60),price:p,weeks:w});v4save();v4reward('gift')}
function addWait(){let n=document.getElementById('waitName').value.trim(),p=+document.getElementById('waitPrice').value;if(!n||!Number.isInteger(p)||p<1||p>10000000)return toast('물건과 가격을 입력해 주세요.');v.decisionWait.unshift({name:n.slice(0,60),price:p,at:Date.now()});v4save();render()}
function finishWait(i,keep){let x=v.decisionWait[i];if(!x)return;if(Date.now()-x.at<86400000)return toast('24시간이 지난 뒤 결정할 수 있어요.');v.decisionWait.splice(i,1);v4save();v4reward('wait');toast(keep?'구매 계획을 다시 확인했어요.':'구매하지 않기로 결정했어요.')}
function coachAsk(i){let q=[['간식에 5,000원을 쓰고 싶어요.','이번 주에 꼭 필요한 지출이 있는지 먼저 살펴볼까요?'],['친구에게 돈을 빌려도 될까요?','돈을 빌리기 전에 다른 방법과 갚을 계획을 생각해 볼까요?'],['선물을 사고 싶어요.','목표 금액과 남은 기간을 정해 저축 계획을 세워볼까요?'],['게임 아이템이 너무 사고 싶어요.','지금 사는 선택과 조금 기다리는 선택을 비교해 볼까요?']][i];v.coachHistory.push({q:q[0],a:q[1]});v4save();render();toast('생각해 볼 질문을 추천했어요.')}
function emergencyChoice(good){if(!good)return toast('비상금을 모두 쓰면 갑작스러운 지출에 대비하기 어려워요.');if(v.emergency<1500)return toast('비상금이 부족해요.');v.emergency-=1500;v4save();v4reward('emergency')}
function sendLetter(){let t=document.getElementById('letterText').value.trim(),p=+document.getElementById('letterPoints').value;if(!t||!Number.isInteger(p)||p<0||p>2000)return toast('미션 내용과 0~2,000P 보상을 확인해 주세요.');v.letters.push({id:Date.now(),text:t.slice(0,160),points:p,done:false,requested:false});v4save();render();toast('미션 편지를 보냈어요.')}
function requestLetter(id){let x=v.letters.find(x=>x.id===id);if(!x)return;x.requested=true;v4save();render();toast('부모님께 완료 승인을 요청했어요.')}
function approveLetter(id){let x=v.letters.find(x=>x.id===id);if(!x||x.done||!x.requested)return;if(x.points&&!reward(x.points,'부모 미션 편지 완료'))return;x.done=true;v.petXP++;v4save();render();toast('미션을 승인했어요.')}
function finishCoop(){let total=+document.getElementById('coopA').value + +document.getElementById('coopB').value,ok=total<=8000;v.coop.push({total,ok});v4save();if(ok)v4reward('coop');else{render();toast('예산을 초과했어요. 친구와 다시 계획해 보세요.')}}
function addWish(){let n=document.getElementById('wishName').value.trim(),p=+document.getElementById('wishPoints').value;if(!n||!Number.isInteger(p)||p<1||p>1000000)return toast('상품명과 포인트를 확인해 주세요.');v.wish.unshift({id:Date.now(),name:n.slice(0,50),points:p,approved:false});v4save();render()}
function approveWish(id){let x=v.wish.find(x=>x.id===id);if(!x)return;x.approved=true;v4save();render();toast('소원 목표를 승인했어요. 실제 상품 교환은 별도입니다.')}
function storyPick(i){v.story.push(i);v4save();if(v.story.length===3)v4reward('story');else render()}
const v3render=render;render=function(){if(page==='play'||v4games.some(x=>x[0]===page)){v3render();document.getElementById('screen').innerHTML=v4page()}else v3render();let nav=document.getElementById('nav');if(mode==='child')nav.insertAdjacentHTML('beforeend',`<button class="${page==='play'?'active':''}" onclick="go('play')"><span>🎡</span>놀이터</button>`);else nav.insertAdjacentHTML('beforeend',`<button class="${page==='letters'?'active':''}" onclick="go('letters')"><span>💌</span>미션편지</button>`);if(page==='home'&&mode==='child')document.getElementById('screen').insertAdjacentHTML('beforeend',v4card('🎡 머니플레이 월드',`<p class="muted">15가지 금융 게임과 성장 지도를 만나보세요.</p>${btn('머니타운으로 떠나기','go(\'play\')','full')}`));if(page==='home'&&mode==='parent')document.getElementById('screen').insertAdjacentHTML('beforeend',v4card('💌 부모님 미션 편지',`<p class="muted">자녀에게 직접 미션을 보내고 완료를 승인할 수 있어요.</p>${btn('미션 편지 쓰기','go(\'letters\')','full')}`));};

render();</script></body></html>
