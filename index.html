{border:2px solid #edf0f7;background:white;border-radius:18px;padding:13px;text-align:left;color:var(--ink)}.choice.selected{border-color:#91d7ff;background:#f0faff}.choice .big{font-size:29px;display:block;margin-bottom:7px}.choice strong{font-size:13px;display:block}.choice small{font-size:10px;color:var(--muted)}.transaction{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f7}.transaction:last-child{border-bottom:0}.tx-icon{width:39px;height:39px;border-radius:14px;background:#f1f7ff;display:grid;place-items:center;font-size:19px;flex-shrink:0}.tx-info{flex:1;min-width:0}.tx-info strong{display:block;font-size:12px}.tx-info small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.tx-amount{text-align:right;font-size:13px;font-weight:900}.tx-amount small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:4px}.notice{padding:12px 13px;border-radius:15px;background:#fff8dc;color:#7c6730;font-size:11px;line-height:1.65;margin:12px 0}.success-box{background:#e5f8ee;color:#286b4a;padding:13px;border-radius:15px;font-size:12px;line-height:1.6}.quiz-option{display:block;width:100%;text-align:left;padding:14px;border:1px solid #e8edf5;background:#fff;border-radius:15px;margin:8px 0;color:var(--ink);font-weight:750;font-size:13px}.quiz-option.correct{border-color:#8bd5ae;background:#effbf4}.quiz-option.wrong{border-color:#ffb5bf;background:#fff3f4}.quiz-option:disabled{cursor:default}.q-number{font-size:11px;font-weight:900;color:#6e91b7}.q-question{font-size:19px;line-height:1.55;font-weight:900;margin:12px 0 18px;letter-spacing:-.3px}.modal-backdrop{position:fixed;inset:0;background:#23334d55;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(420px,100%);background:#fff;border-radius:25px;padding:23px;box-shadow:0 25px 70px #1d2b4433;max-height:90vh;overflow:auto}.modal h2{font-size:20px;margin:0 0 8px}.modal p{font-size:12px;color:var(--muted);line-height:1.7}.modal-actions{display:flex;gap:8px;margin-top:17px}.modal-actions .btn{flex:1}.hidden{display:none!important}.welcome{min-height:calc(100vh - 30px);display:flex;flex-direction:column;justify-content:center;padding:24px 20px 45px;text-align:center}.welcome .logo-bunny{font-size:100px;line-height:1.2;filter:drop-shadow(0 8px 5px #7e9ab522)}.welcome h1{font-size:35px;letter-spacing:-1.2px;margin:5px 0}.welcome .tagline{font-size:16px;font-weight:900;margin:8px 0}.welcome .desc{font-size:12px;line-height:1.8;color:var(--muted);max-width:300px;margin:0 auto 25px}.role-btn{display:flex;align-items:center;gap:13px;text-align:left;padding:16px;border-radius:20px;margin:9px 0;width:100%;background:white;border:1px solid #e7edf7;box-shadow:var(--shadow);color:var(--ink)}.role-btn .role-icon{font-size:30px;width:47px;height:47px;display:grid;place-items:center;border-radius:15px;background:#eaf7ff}.role-btn.parent .role-icon{background:#f2eaff}.role-btn strong{display:block;font-size:14px}.role-btn small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}.demo-note{font-size:10px;color:#929caf;line-height:1.6;margin:16px 8px 0}.top-right{display:flex;align-items:center;gap:7px}.avatar{width:34px;height:34px;border-radius:12px;background:#e7f4ff;display:grid;place-items:center}.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:12px}.empty span{font-size:35px;display:block;margin-bottom:9px}.level-badge{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#f0eaff,#eaf8ff);padding:14px;border-radius:19px}.level-badge .level-emoji{font-size:34px}.level-badge strong{display:block;font-size:14px}.level-badge small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.metric-row{display:flex;gap:8px}.metric{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 9px;text-align:center}.metric strong{display:block;font-size:17px}.metric small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.toggle-line{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px;font-weight:800}.switch{width:46px;height:27px;border-radius:99px;background:#dfe4ec;padding:3px;transition:.2s}.switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:white;box-shadow:0 1px 4px #0002;transition:.2s}.switch.on{background:#8ed8ff}.switch.on:after{transform:translateX(19px)}.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 17px;border-radius:15px;background:#293d59;color:white;font-size:12px;font-weight:800;box-shadow:0 8px 24px #26344b30;animation:pop .2s ease}.confetti{position:fixed;z-index:45;inset:0;pointer-events:none;display:grid;place-items:center;background:#ffffff6b;animation:fade .9s forwards}.confetti div{font-size:48px;text-align:center;font-weight:950;color:#475e91;text-shadow:0 3px white;line-height:1.7}.confetti small{font-size:15px;display:block}@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}.footer-note{text-align:center;color:#a1aabb;font-size:10px;padding:14px 0 5px}.parent-chip{background:#f0eaff;color:#775ab4}.divider{height:1px;background:#eef1f6;margin:15px 0}.small{font-size:11px;color:var(--muted);line-height:1.6}.bar-row{margin:13px 0}.bar-label{display:flex;justify-content:space-between;font-size:11px;font-weight:800}.bar{height:9px;background:#edf0f6;border-radius:99px;margin-top:7px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#8bdcff,#c3b5ff);border-radius:99px}
@media(min-width:700px){body{padding:24px 0}.app{border-radius:30px;min-height:calc(100vh - 48px)}.bottom-nav{bottom:24px;border-radius:0 0 30px 30px}.toast{bottom:115px}}

<body>
<div class="app">
  <div class="status"><span id="clock">9:41</span><span>●●●　 Wi-Fi　▰</span></div>
  <div id="welcome" class="welcome">
    <div class="logo-bunny">🐰</div>
    <h1>MONEY <span style="color:#8b9de5">PLAY</span></h1>
    <div class="tagline">돈을 배우는 가장 즐거운 방법!</div>
    <p class="desc">용돈도 관리하고, 퀴즈도 풀고,<br>나만의 금융 레벨을 올려 봐요!</p>
    <button class="role-btn" onclick="enterMode('child')"><span class="role-icon">🧒</span><span><strong>아이 전용으로 시작하기</strong><small>용돈 관리 · 카드 사용 · 금융 퀴즈 · 레벨업 · 저축 목표</small></span></button>
    <button class="role-btn parent" onclick="enterMode('parent')"><span class="role-icon">👨‍👩‍👧</span><span><strong>부모 전용으로 시작하기</strong><small>용돈 지급 · 카드 한도 설정 · 소비 내역 · 학습 현황</small></span></button>
    <p class="demo-note">🔒 MONEY PLAY는 금융교육용 시제품이에요.<br>실제 은행 계좌나 결제 서비스와 연결되지 않아요.</p>
  </div>
  <div id="shell" class="hidden">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">🐰</div><div>MONEY PLAY<div class="tiny-label" id="modeLabel">나의 금융 놀이터</div></div></div>
      <div class="top-right"><div class="avatar" id="topAvatar">🌈</div><button class="icon-btn" onclick="openSettings()" aria-label="설정">⚙️</button></div>
    </header>
    <main id="content" class="content"></main>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='moneyPlayDemoV1';
const defaultState=()=>({mode:null,balance:15000,savings:5000,monthlyReceived:15000,monthlySpent:3500,spentToday:0,dailyLimit:5000,cardLocked:false,onlineAllowed:false,cardDesign:'sky',cardName:'나의 첫 번째 카드',points:0,level:1,transactions:[{id:1,date:new Date().toISOString(),store:'문구점',amount:2000,type:'결제',balanceAfter:13000,icon:'✏️'},{id:2,date:new Date().toISOString(),store:'간식 구매',amount:1500,type:'결제',balanceAfter:11500,icon:'🍪'},{id:3,date:new Date().toISOString(),store:'부모님 용돈',amount:15000,type:'용돈',balanceAfter:15000,icon:'🎁'}],quizRewarded:[],quizAnswered:{},missionDone:[],missions:[{id:'need',title:'필요한 것과 갖고 싶은 것 구분하기',icon:'🧐',desc:'오늘 사고 싶은 물건 하나를 떠올리고 꼭 필요한지 생각해 봐요.',reward:15},{id:'review',title:'오늘의 소비 내역 확인하기',icon:'🧾',desc:'오늘 내가 쓴 돈을 확인하고 잘 썼는지 돌아봐요.',reward:15},{id:'save10',title:'용돈의 10% 저축 계획 세우기',icon:'🐷',desc:'받은 용돈 중 얼마를 저축할지 계획해 봐요.',reward:20},{id:'compare',title:'두 상품의 가격 비교하기',icon:'🔎',desc:'같은 종류의 상품 가격을 비교하면 어떤 점이 좋을까요?',reward:15},{id:'pause',title:'잠깐 멈추고 충동구매 예방하기',icon:'⏳',desc:'갖고 싶은 물건을 사기 전에 하루 생각해 보는 연습을 해요.',reward:15}],savingsGoal:{name:'새 장난감 사기',target:20000,current:5000},historyLearned:[],onlineNote:'',createdAt:new Date().toISOString()});
let state=loadState(),page='home',quizIndex=0,quizSession=[],quizCorrect=0,quizEarned=0,quizChoice=null,quizSubmitted=false,selectedDesign='sky';
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));return s?{...defaultState(),...s}:defaultState()}catch(e){return defaultState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return Math.max(0,Number(n)||0).toLocaleString('ko-KR')+'원'}
function fmtDate(d){try{return new Date(d).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' '+new Date(d).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function todayKey(){return new Date().toISOString().slice(0,10)}
function levelInfo(points=state.points){let levels=[{level:1,name:'새싹 탐험가',min:0,emoji:'🌱'},{level:2,name:'용돈 수호자',min:50,emoji:'🛡️'},{level:3,name:'저축 마스터',min:120,emoji:'🐷'},{level:4,name:'소비 전략가',min:220,emoji:'🧠'},{level:5,name:'금융 챔피언',min:350,emoji:'🏆'}];let cur=levels[0],next=null;for(let i=0;i<levels.length;i++){if(points>=levels[i].min)cur=levels[i];else{next=levels[i];break}}return {...cur,next,progress:next?Math.min(100,Math.round((points-cur.min)/(next.min-cur.min)*100)):100,remaining:next?next.min-points:0}}
function updateLevel(){let old=state.level,info=levelInfo();state.level=info.level;if(state.level>old)celebrate('레벨 업! 🎉',`축하해요! ${info.name}이 되었어요!`)}
function addPoints(n,reason){state.points+=n;updateLevel();save();toast(`✨ ${reason} +${n}P`)}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2400)}
function celebrate(title,sub){let d=document.createElement('div');d.className='confetti';d.innerHTML=`<div>🎉 ${esc(title)}<small>${esc(sub)}</small>✨ 🌟 🎊</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enterMode(mode){state.mode=mode;save();page=mode==='child'?'home':'dashboard';document.getElementById('welcome').classList.add('hidden');document.getElementById('shell').classList.remove('hidden');render()}
function switchMode(mode){state.mode=mode;save();page=mode==='child'?'home':'dashboard';closeModal();render();toast(mode==='child'?'아이 화면으로 전환했어요':'부모 화면으로 전환했어요')}
function exitToWelcome(){state.mode=null;save();document.getElementById('shell').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden');closeModal()}
const childNav=[['home','🏠','홈'],['card','💳','내 카드'],['playground','🎮','금융 놀이터'],['savings','🐷','저축 목표'],['parent','👨‍👩‍👧','보호자']];
const parentNav=[['dashboard','📊','대시보드'],['allowance','🎁','용돈 지급'],['management','💳','카드 관리'],['transactions','🧾','소비 내역'],['learning','📚','학습 현황']];
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(!state.mode)return;document.getElementById('modeLabel').textContent=state.mode==='child'?'나의 금융 놀이터':'보호자 대시보드';document.getElementById('topAvatar').textContent=state.mode==='child'?'🐰':'👨‍👩‍👧';document.getElementById('bottomNav').innerHTML=(state.mode==='child'?childNav:parentNav).map(([p,e,t])=>`<button class="nav-item ${page===p?'active':''}" onclick="go('${p}')"><span class="nav-emoji">${e}</span><span>${t}</span></button>`).join('');let root=document.getElementById('content');const pages={home:homePage,card:cardPage,playground:playgroundPage,savings:savingsPage,parent:parentPage,dashboard:dashboardPage,allowance:allowancePage,management:managementPage,transactions:transactionsPage,learning:learningPage};root.innerHTML=(pages[page]||homePage)();root.querySelectorAll('[data-autofocus]').forEach(x=>x.focus())}
function section(title,right=''){return `<div class="section-head"><h2>${title}</h2><span>${right}</span></div>`}
function levelWidget(){let l=levelInfo();return `<div class="level-badge"><div class="level-emoji">${l.emoji}</div><div style="flex:1"><strong>레벨 ${l.level} · ${l.name}</strong><small>${l.next?`다음 레벨까지 ${l.remaining}P 남았어요`:'최고 레벨 달성!'}</small><div class="progress"><span style="width:${l.progress}%"></span></div></div><b style="font-size:13px">${state.points}P</b></div>`}
function cardMarkup(compact=false){const designs={sky:{name:'하늘 토끼 카드',emoji:'🐰',cls:''},pink:{name:'핑크 곰돌이 카드',emoji:'🐻',cls:'pink'},green:{name:'초록 공룡 카드',emoji:'🦖',cls:'green'},purple:{name:'보라 고양이 카드',emoji:'🐱',cls:'purple'}};let d=designs[state.cardDesign]||designs.sky;return `<div class="mini-card ${d.cls}"><div class="card-name">MONEY PLAY <span style="font-size:9px">✦ KIDS</span></div><div class="card-emoji">${d.emoji}</div><div class="chip"></div><div class="number">••••　••••　••••　${String(1000+state.cardDesign.length*173).slice(-4)}</div><div class="card-bottom"><div><small>CARD HOLDER</small><div style="font-weight:900;font-size:12px;margin-top:3px">${esc(state.cardName)}</div></div><div style="font-size:10px;font-weight:900">MP</div></div></div>`}
function homePage(){let l=levelInfo(),goal=state.savingsGoal,goalPct=Math.min(100,Math.round(goal.current/Math.max(1,goal.target)*100));return `<div class="hero"><h1>안녕, 금융 탐험가! 👋</h1><p>오늘도 즐겁게 배우고<br>똑똑하게 용돈을 관리해 봐요</p><div class="bunny">🐰</div></div>${section('나의 용돈','차곡차곡 모아 봐요')}<div class="card balance-card"><div class="eyebrow">💰 사용 가능한 용돈</div><div class="money">${money(state.balance)}</div><div class="pill">이번 달 받은 용돈 ${money(state.monthlyReceived)}</div><div class="divider"></div><div class="metric-row"><div style="flex:1"><div class="eyebrow">🐷 저축한 돈</div><strong>${money(state.savings)}</strong></div><div style="flex:1"><div class="eyebrow">🛍️ 이번 달 사용</div><strong>${money(state.monthlySpent)}</strong></div></div></div>${section('나의 성장','공부할수록 레벨 업!')}${levelWidget()}${section('나만의 카드','가상 카드')}${cardMarkup()}<button class="btn full" style="margin-top:9px" onclick="go('card')">카드 확인하기 →</button>${section('오늘의 금융 놀이터','오늘도 도전!')}<div class="grid"><button class="card stat" onclick="startQuiz()"><span class="emoji">🧠</span><strong style="font-size:15px">금융 퀴즈</strong><p>퀴즈 정답 맞히고 10P 받기</p></button><button class="card stat" onclick="go('playground')"><span class="emoji">🎯</span><strong style="font-size:15px">오늘의 미션</strong><p>미션 완료하고 포인트 받기</p></button></div>${section('저축 목표',`${goalPct}% 달성`)}<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><strong style="font-size:13px">${esc(goal.name)}</strong><p class="small">목표 ${money(goal.target)}</p></div><div style="font-size:24px">🐷</div></div><div class="progress"><span style="width:${goalPct}%"></span></div><div class="small">${money(goal.current)} 모았어요!</div><button class="btn green full" style="margin-top:12px" onclick="go('savings')">저축하러 가기</button></div>${section('최근 활동','최근 3건')}${transactionList(state.transactions.slice(0,3))}<div class="footer-note">MONEY PLAY · 금융교육용 가상 서비스</div>`}
function cardPage(){return `<h1 class="page-title">나만의 카드 💳</h1><p class="page-sub">마음에 드는 디자인을 고르고 가상 결제를 체험해 봐요.</p>${cardMarkup()}<div class="card" style="margin-top:13px"><div class="eyebrow">사용 가능한 잔액</div><div class="money">${money(state.balance)}</div><div class="toggle-line"><span>카드 상태</span><span class="pill ${state.cardLocked?'':'parent-chip'}">${state.cardLocked?'🔒 잠금 상태':'🔓 사용 가능'}</span></div><div class="toggle-line"><span>오늘 사용한 금액</span><strong>${money(state.spentToday)}</strong></div><div class="toggle-line"><span>오늘 남은 한도</span><strong>${money(Math.max(0,state.dailyLimit-state.spentToday))}</strong></div><p class="small">가상의 카드 번호예요. 실제 결제는 발생하지 않아요.</p></div>${section('카드 디자인 고르기','선택 즉시 적용')}<div class="option-grid">${[['sky','🐰','하늘 토끼'],['pink','🐻','핑크 곰돌이'],['green','🦖','초록 공룡'],['purple','🐱','보라 고양이']].map(([id,e,n])=>`<button class="choice ${state.cardDesign===id?'selected':''}" onclick="setDesign('${id}')"><span class="big">${e}</span><strong>${n} 카드</strong><small>${state.cardDesign===id?'✓ 선택됨':'눌러서 선택'}</small></button>`).join('')}</div><div class="field"><label>카드 이름</label><input class="input" maxlength="18" value="${esc(state.cardName)}" onchange="setCardName(this.value)" placeholder="나의 첫 번째 카드"></div>${section('가상 결제 체험','실제 결제 아님')}<div class="grid">${[['✏️','문구점',2000],['🍪','간식 구매',1500],['🧸','장난감 구매',5000],['🌐','온라인 쇼핑',2500]].map(([e,n,a])=>`<button class="card" style="text-align:left" onclick="confirmPayment('${n}',${a},'${e}',${n==='온라인 쇼핑'})"><div style="font-size:25px">${e}</div><strong style="display:block;font-size:13px;margin:8px 0">${n}</strong><span style="font-size:12px;color:#6d88a5;font-weight:900">${money(a)}</span></button>`).join('')}</div>${state.cardLocked?'<div class="notice">🔒 카드가 잠겨 있어 결제할 수 없어요. 보호자에게 잠금 해제를 요청해요.</div>':''}${section('최근 카드 사용 내역','')}${transactionList(state.transactions.filter(t=>t.type==='결제').slice(0,5))}`}
function setDesign(id){state.cardDesign=id;save();render();toast('카드 디자인을 바꿨어요!')}
function setCardName(v){state.cardName=v.trim()||'나의 첫 번째 카드';save();render();toast('카드 이름을 저장했어요')}
function confirmPayment(store,amount,icon,online){if(state.cardLocked)return toast('🔒 카드가 잠겨 있어요');if(online&&!state.onlineAllowed)return toast('온라인 결제는 보호자 허락이 필요해요');if(amount>state.balance)return toast('잔액이 부족해요. 용돈을 확인해 봐요!');if(state.spentToday+amount>state.dailyLimit)return toast('하루 카드 사용 한도를 넘었어요');openModal(`<h2>💳 가상 결제 확인</h2><p>${esc(store)}에서 ${money(amount)}을(를) 결제할까요?</p><div class="card" style="text-align:center;margin:14px 0"><div class="eyebrow">결제 금액</div><div class="money">${money(amount)}</div><div class="small">결제 후 잔액 ${money(state.balance-amount)}</div></div><p>이 결제는 연습용 가상 결제이며 실제 돈은 움직이지 않아요.</p>`,`<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="pay('${store}',${amount},'${icon}')">결제하기</button>`)}
function pay(store,amount,icon){state.balance-=amount;state.spentToday+=amount;state.monthlySpent+=amount;state.transactions.unshift({id:Date.now(),date:new Date().toISOString(),store,amount,type:'결제',balanceAfter:state.balance,icon});save();closeModal();render();toast('결제가 완료됐어요! 남은 용돈을 확인해 봐요.')}
function transactionList(list){if(!list.length)return `<div class="empty"><span>🧾</span>아직 거래 내역이 없어요.</div>`;return `<div class="card">${list.map(t=>`<div class="transaction"><div class="tx-icon">${t.icon||'💰'}</div><div class="tx-info"><strong>${esc(t.store)}</strong><small>${fmtDate(t.date)} · ${esc(t.type)}</small></div><div class="tx-amount" style="color:${t.type==='결제'||t.type==='저축'?'#5a6b83':'#48a67b'}">${t.type==='결제'||t.type==='저축'?'-':'+'}${money(t.amount)}<small>잔액 ${money(t.balanceAfter)}</small></div></div>`).join('')}</div>`}
function playgroundPage(){let done=state.missionDone;return `<h1 class="page-title">금융 놀이터 🎮</h1><p class="page-sub">퀴즈와 미션을 하며 똑똑한 금융 습관을 길러 봐요!</p><div class="hero" style="min-height:125px"><h1 style="font-size:20px">오늘도 한 걸음 성장! 🌟</h1><p>배우고 실천할수록 포인트가 쌓여요.</p><div class="bunny">🦊</div></div>${section('금융 퀴즈','정답마다 10P')}<div class="card"><div style="font-size:35px">🧠</div><strong style="font-size:15px">똑똑 금융 퀴즈</strong><p class="small">용돈, 저축, 소비, 개인정보 등 다양한 문제를 풀어 봐요.</p><div class="metric-row"><div class="metric"><strong>${Object.keys(state.quizAnswered).length}</strong><small>푼 문제</small></div><div class="metric"><strong>${state.quizRewarded.length}</strong><small>보상 받은 문제</small></div><div class="metric"><strong>20</strong><small>전체 문제</small></div></div><button class="btn primary full" style="margin-top:13px" onclick="startQuiz()">퀴즈 시작하기 →</button></div>${section('오늘의 미션','완료하면 포인트!')}${state.missions.map(m=>`<div class="card" style="margin-bottom:10px"><div style="display:flex;gap:11px"><div style="font-size:28px">${m.icon}</div><div style="flex:1"><strong style="font-size:13px">${esc(m.title)}</strong><p class="small">${esc(m.desc)}</p><span class="pill">✨ ${m.reward}P</span></div></div><button class="btn ${done.includes(m.id)?'ghost':'green'} full" style="margin-top:12px" ${done.includes(m.id)?'disabled':''} onclick="completeMission('${m.id}')">${done.includes(m.id)?'✓ 완료했어요':'미션 완료하기'}</button></div>`).join('')}`}
function completeMission(id){if(state.missionDone.includes(id))return toast('이미 완료한 미션이에요!');let m=state.missions.find(x=>x.id===id);if(!m)return;state.missionDone.push(id);state.historyLearned.push(m.title);addPoints(m.reward,'미션 완료');render();celebrate('미션 성공!',`멋져요! ${m.reward}P를 받았어요.`)}
function savingsPage(){let g=state.savingsGoal,pct=Math.min(100,Math.round(g.current/Math.max(1,g.target)*100));return `<h1 class="page-title">저축 목표 🐷</h1><p class="page-sub">갖고 싶은 것을 정하고 조금씩 모아 봐요. 작은 저축도 멋진 시작이에요!</p><div class="card" style="background:linear-gradient(135deg,#fff0f7,#f2edff)"><div style="text-align:center;font-size:55px">🐷</div><div style="text-align:center;font-size:11px;color:#8b7292">나의 저축 목표</div><h2 style="text-align:center;font-size:21px;margin:7px 0 15px">${esc(g.name)}</h2><div class="money" style="text-align:center">${money(g.current)} <small style="color:#8590a2">/ ${money(g.target)}</small></div><div class="progress" style="height:12px"><span style="width:${pct}%;background:linear-gradient(90deg,#ffb9d8,#c6b4ff)"></span></div><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:850"><span>달성률 ${pct}%</span><span>${pct>=100?'목표 달성! 🎉':`${money(Math.max(0,g.target-g.current))} 남았어요`}</span></div>${pct>=100?'<div class="success-box" style="margin-top:13px;text-align:center">🎉 축하해요! 목표를 달성했어요. 계획적으로 모은 멋진 결과예요!</div>':''}</div><div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px;font-size:14px">🎯 저축 목표 바꾸기</h3><div class="field"><label>목표 이름</label><input id="goalName" class="input" maxlength="30" value="${esc(g.name)}"></div><div class="field"><label>목표 금액 (원)</label><input id="goalTarget" class="input" type="number" min="100" max="1000000" step="100" value="${g.target}"></div><button class="btn full" onclick="updateGoal()">목표 저장하기</button></div><div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px;font-size:14px">💰 저축하기</h3><p class="small">사용 가능한 용돈에서 저축 금액을 옮겨요. 저축은 소비가 아니라 내 목표를 위한 돈 모으기예요.</p><div class="btn-row" style="margin:12px 0">${[500,1000,2000,5000].map(n=>`<button class="btn ghost" onclick="setSaveAmount(${n})">${money(n)}</button>`).join('')}</div><div class="field"><label>저축할 금액 (원)</label><input id="saveAmount" class="input" type="number" min="1" step="100" placeholder="예: 1000"></div><button class="btn green full" onclick="saveMoney()">저축하기 🐷</button><div class="small" style="margin-top:10px">사용 가능 용돈 ${money(state.balance)} · 전체 저축 ${money(state.savings)}</div></div>`}
function setSaveAmount(n){let el=document.getElementById('saveAmount');if(el)el.value=n}
function updateGoal(){let name=document.getElementById('goalName').value.trim(),target=Number(document.getElementById('goalTarget').value);if(!name||!Number.isFinite(target)||target<100||target>1000000)return toast('목표 이름과 100~1,000,000원 금액을 입력해 주세요');state.savingsGoal.name=name;state.savingsGoal.target=Math.round(target);save();render();toast('저축 목표를 저장했어요!')}
function saveMoney(){let el=document.getElementById('saveAmount'),n=Math.floor(Number(el.value));if(!Number.isFinite(n)||n<1)return toast('저축할 금액을 입력해 주세요');if(n>state.balance)return toast('사용 가능한 용돈이 부족해요');state.balance-=n;state.savings+=n;state.savingsGoal.current+=n;state.transactions.unshift({id:Date.now(),date:new Date().toISOString(),store:'저축 목표',amount:n,type:'저축',balanceAfter:state.balance,icon:'🐷'});save();render();toast('저축했어요! 차곡차곡 모으고 있어요 🐷');if(state.savingsGoal.current>=state.savingsGoal.target)celebrate('저축 목표 달성!',`정말 잘했어요! ${state.savingsGoal.name}`)}

function startQuiz(){quizSession=quizData.map((q,i)=>i).filter(i=>!state.quizAnswered[i]);if(!quizSession.length){showQuizResult(true);return}quizIndex=0;quizCorrect=0;quizEarned=0;quizChoice=null;quizSubmitted=false;renderQuiz()}
function renderQuiz(){page='quiz';document.getElementById('bottomNav').classList.add('hidden');const root=document.getElementById('content');if(quizIndex>=quizSession.length){showQuizResult(false);return}let id=quizSession[quizIndex],q=quizData[id],answered=quizSubmitted;root.innerHTML=`<button class="btn ghost" onclick="endQuiz()">← 금융 놀이터</button><div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px"><span class="q-number">${esc(q.cat)}</span><span class="pill">${quizIndex+1} / ${quizSession.length}</span></div><div class="progress"><span style="width:${Math.round((quizIndex+1)/quizSession.length*100)}%"></span></div><div class="q-question">${esc(q.q)}</div><div>${q.o.map((o,i)=>`<button class="quiz-option ${answered&&i===q.a?'correct':''} ${answered&&i===quizChoice&&i!==q.a?'wrong':''}" ${answered?'disabled':''} onclick="chooseAnswer(${i})"><span style="display:inline-grid;place-items:center;width:25px;height:25px;border-radius:9px;background:#f0f4fb;margin-right:8px">${['①','②','③','④'][i]}</span>${esc(o)}</button>`).join('')}</div>${answered?`<div class="${quizChoice===q.a?'success-box':'notice'}">${quizChoice===q.a?'🎉 정답이에요! 10포인트를 받았어요.':'💡 아쉬워요! 정답을 확인해 봐요.'}<br><strong>정답: ${esc(q.o[q.a])}</strong><br>${esc(q.ex)}</div><button class="btn primary full" style="margin-top:13px" onclick="nextQuestion()">${quizIndex===quizSession.length-1?'결과 보기':'다음 문제 →'}</button>`:`<button class="btn primary full" style="margin-top:13px" ${quizChoice===null?'disabled':''} onclick="submitAnswer()">정답 확인하기</button>`}`}
function chooseAnswer(i){if(quizSubmitted)return;quizChoice=i;renderQuiz()}
function submitAnswer(){if(quizChoice===null||quizSubmitted)return;let id=quizSession[quizIndex],q=quizData[id];quizSubmitted=true;state.quizAnswered[id]={choice:quizChoice,correct:quizChoice===q.a,date:new Date().toISOString()};if(quizChoice===q.a){quizCorrect++;if(!state.quizRewarded.includes(id)){state.quizRewarded.push(id);state.points+=10;quizEarned+=10;updateLevel()}}state.historyLearned.push(q.cat);save();renderQuiz()}
function nextQuestion(){quizIndex++;quizChoice=null;quizSubmitted=false;renderQuiz()}
function showQuizResult(allDone){let answered=Object.values(state.quizAnswered),correct=answered.filter(x=>x.correct).length,total=answered.length,pct=total?Math.round(correct/total*100):0;document.getElementById('content').innerHTML=`<div style="text-align:center;padding:24px 0 10px"><div style="font-size:75px">🏆</div><h1 class="page-title">퀴즈 결과</h1><p class="page-sub">${allDone?'모든 문제를 풀었어요! 정말 대단해요.':'오늘도 금융 지식을 쌓았어요!'}</p></div><div class="card"><div class="metric-row"><div class="metric"><strong>${correct}</strong><small>정답 개수</small></div><div class="metric"><strong>${pct}%</strong><small>누적 정답률</small></div><div class="metric"><strong>+${quizEarned}P</strong><small>이번에 획득</small></div></div><div class="divider"></div><strong style="font-size:14px">오늘의 금융 배움 🌱</strong><p class="small">용돈을 계획하고, 필요한 것과 갖고 싶은 것을 구분하고, 개인정보를 안전하게 지키는 방법을 배웠어요.</p><div class="success-box">기억해요! 돈을 잘 관리하는 것은 많이 쓰는 게 아니라, 계획하고 생각하며 사용하는 거예요.</div></div><button class="btn primary full" style="margin-top:12px" onclick="endQuiz()">금융 놀이터로 돌아가기</button>${quizData.map((q,i)=>state.quizAnswered[i]?`<div class="card" style="margin-top:9px"><span class="pill">${esc(q.cat)}</span><p style="font-size:12px;font-weight:850">${esc(q.q)}</p><div class="small">정답: ${esc(q.o[q.a])}</div><div class="small">${esc(q.ex)}</div></div>`:'').join('')}`;document.getElementById('bottomNav').classList.add('hidden')}
function endQuiz(){document.getElementById('bottomNav').classList.remove('hidden');page='playground';render()}
function parentPage(){return `<h1 class="page-title">보호자 화면 👨‍👩‍👧</h1><p class="page-sub">아이의 용돈과 학습을 함께 살펴봐요.</p><div class="notice">🔐 이 시제품은 데모용이에요. 부모 화면은 별도 비밀번호 인증이 없는 시연용 화면이므로 실제 금융정보를 입력하지 마세요.</div><div class="grid"><button class="card stat" onclick="switchMode('parent')"><span class="emoji">📊</span><strong style="font-size:14px">보호자 대시보드</strong><p>용돈과 학습 현황 보기</p></button><button class="card stat" onclick="switchMode('parent');setTimeout(()=>go('allowance'),0)"><span class="emoji">🎁</span><strong style="font-size:14px">용돈 지급</strong><p>아이에게 용돈 보내기</p></button><button class="card stat" onclick="switchMode('parent');setTimeout(()=>go('management'),0)"><span class="emoji">💳</span><strong style="font-size:14px">카드 관리</strong><p>한도와 잠금 설정</p></button><button class="card stat" onclick="switchMode('parent');setTimeout(()=>go('learning'),0)"><span class="emoji">📚</span><strong style="font-size:14px">학습 현황</strong><p>퀴즈와 미션 확인</p></button></div><button class="btn primary full" style="margin-top:15px" onclick="switchMode('parent')">부모 모드로 전환하기 →</button><button class="btn ghost full" style="margin-top:8px" onclick="openSettings()">설정 및 모드 전환</button>`}
function dashboardPage(){let total=Object.keys(state.quizAnswered).length,correct=Object.values(state.quizAnswered).filter(x=>x.correct).length,pct=total?Math.round(correct/total*100):0,g=state.savingsGoal,gp=Math.min(100,Math.round(g.current/Math.max(1,g.target)*100));return `<h1 class="page-title">보호자 대시보드 📊</h1><p class="page-sub">아이의 금융 생활을 한눈에 확인해요.</p><div class="grid"><div class="card stat"><span class="emoji">💰</span><strong>${money(state.balance)}</strong><p>사용 가능 용돈</p></div><div class="card stat"><span class="emoji">🐷</span><strong>${money(state.savings)}</strong><p>누적 저축 금액</p></div><div class="card stat"><span class="emoji">💳</span><strong>${money(state.spentToday)}</strong><p>오늘 카드 사용</p></div><div class="card stat"><span class="emoji">✨</span><strong>${state.points}P</strong><p>누적 포인트</p></div></div>${section('금융 성장 현황','학습 기반 레벨')}${levelWidget()}<div class="card" style="margin-top:12px"><div class="bar-row"><div class="bar-label"><span>퀴즈 진행</span><span>${total} / ${quizData.length}</span></div><div class="bar"><span style="width:${total/quizData.length*100}%"></span></div></div><div class="bar-row"><div class="bar-label"><span>퀴즈 정답률</span><span>${pct}%</span></div><div class="bar"><span style="width:${pct}%"></span></div></div><div class="bar-row"><div class="bar-label"><span>미션 완료</span><span>${state.missionDone.length} / ${state.missions.length}</span></div><div class="bar"><span style="width:${state.missionDone.length/state.missions.length*100}%"></span></div></div><div class="bar-row"><div class="bar-label"><span>저축 목표 달성률</span><span>${gp}%</span></div><div class="bar"><span style="width:${gp}%"></span></div></div></div>${section('빠른 관리','') }<div class="grid"><button class="btn" onclick="go('allowance')">🎁 용돈 지급</button><button class="btn" onclick="go('management')">💳 카드 설정</button><button class="btn" onclick="go('transactions')">🧾 거래 내역</button><button class="btn" onclick="go('learning')">📚 학습 현황</button></div>${section('최근 거래','최근 5건')}${transactionList(state.transactions.slice(0,5))}`}
function allowancePage(){return `<h1 class="page-title">용돈 지급 🎁</h1><p class="page-sub">아이에게 지급할 가상 용돈을 입력해 주세요.</p><div class="card"><div style="font-size:42px;text-align:center;margin:5px">🎁</div><div style="text-align:center;font-size:12px;color:var(--muted)">현재 사용 가능 용돈</div><div class="money" style="text-align:center">${money(state.balance)}</div><div class="divider"></div><label style="font-size:12px;font-weight:850">빠른 금액 선택</label><div class="btn-row" style="margin:10px 0">${[3000,5000,10000].map(n=>`<button class="btn ghost" onclick="setAllowance(${n})">${money(n)}</button>`).join('')}</div><div class="field"><label for="allowanceAmount">지급 금액 (원)</label><input class="input" id="allowanceAmount" type="number" min="1" max="1000000" step="500" placeholder="예: 5000"></div><div class="field"><label for="allowanceMemo">메모 (선택)</label><input class="input" id="allowanceMemo" maxlength="30" placeholder="예: 이번 주 용돈"></div><button class="btn primary full" onclick="giveAllowance()">용돈 지급하기 🎉</button></div>${section('최근 지급 내역','')}${transactionList(state.transactions.filter(t=>t.type==='용돈').slice(0,10))}`}
function setAllowance(n){document.getElementById('allowanceAmount').value=n}
function giveAllowance(){let el=document.getElementById('allowanceAmount'),memo=document.getElementById('allowanceMemo'),n=Math.floor(Number(el.value));if(!Number.isFinite(n)||n<1||n>1000000)return toast('1~1,000,000원 사이 금액을 입력해 주세요');state.balance+=n;state.monthlyReceived+=n;state.transactions.unshift({id:Date.now(),date:new Date().toISOString(),store:memo.value.trim()||'부모님 용돈',amount:n,type:'용돈',balanceAfter:state.balance,icon:'🎁'});save();render();toast(`${money(n)} 용돈을 지급했어요!`);celebrate('용돈 지급 완료!',`아이의 용돈에 ${money(n)}이 추가됐어요.`)}
function managementPage(){return `<h1 class="page-title">카드 관리 💳</h1><p class="page-sub">안전한 카드 사용을 위해 한도와 결제 설정을 관리해요.</p>${cardMarkup()}<div class="card" style="margin-top:12px"><div class="toggle-line"><span>카드 상태</span><button class="btn ${state.cardLocked?'green':'danger'}" onclick="toggleLock()">${state.cardLocked?'🔓 잠금 해제':'🔒 카드 잠금'}</button></div><div class="toggle-line"><span>온라인 결제 허용</span><button class="switch ${state.onlineAllowed?'on':''}" onclick="toggleOnline()" aria-label="온라인 결제 허용"></button></div><p class="small">${state.onlineAllowed?'온라인 가상 결제가 허용되어 있어요.':'온라인 결제는 차단되어 있어요.'}</p></div><div class="card" style="margin-top:12px"><h3 style="font-size:14px;margin:0 0 5px">하루 카드 사용 한도</h3><p class="small">한도를 넘는 결제는 자동으로 거절돼요.</p><div class="btn-row" style="margin:12px 0">${[3000,5000,10000].map(n=>`<button class="btn ${state.dailyLimit===n?'primary':'ghost'}" onclick="setLimit(${n})">${money(n)}</button>`).join('')}</div><div class="field"><label>직접 설정 (원)</label><input id="limitInput" class="input" type="number" min="0" max="1000000" step="500" value="${state.dailyLimit}"></div><button class="btn primary full" onclick="saveLimit()">사용 한도 저장하기</button><div class="divider"></div><div class="metric-row"><div class="metric"><strong>${money(state.spentToday)}</strong><small>오늘 사용 금액</small></div><div class="metric"><strong>${money(Math.max(0,state.dailyLimit-state.spentToday))}</strong><small>남은 한도</small></div></div></div>${section('최근 카드 사용 내역','')}${transactionList(state.transactions.filter(t=>t.type==='결제').slice(0,8))}`}
function toggleLock(){state.cardLocked=!state.cardLocked;save();render();toast(state.cardLocked?'카드를 잠갔어요. 아이 화면 결제가 차단돼요.':'카드 잠금을 해제했어요.')}
function toggleOnline(){state.onlineAllowed=!state.onlineAllowed;save();render();toast(state.onlineAllowed?'온라인 가상 결제를 허용했어요':'온라인 가상 결제를 차단했어요')}
function setLimit(n){state.dailyLimit=n;save();render();toast(`하루 한도를 ${money(n)}으로 설정했어요`)}
function saveLimit(){let n=Math.floor(Number(document.getElementById('limitInput').value));if(!Number.isFinite(n)||n<0||n>1000000)return toast('0~1,000,000원 사이로 입력해 주세요');state.dailyLimit=n;save();render();toast('카드 사용 한도를 저장했어요')}
function transactionsPage(){let all=state.transactions;return `<h1 class="page-title">소비 내역 🧾</h1><p class="page-sub">용돈이 들어오고 나간 기록을 확인해요.</p><div class="metric-row"><div class="metric"><strong>${money(state.monthlyReceived)}</strong><small>이번 달 받은 용돈</small></div><div class="metric"><strong>${money(state.monthlySpent)}</strong><small>이번 달 사용한 돈</small></div></div>${section('전체 거래 내역',`${all.length}건`)}${transactionList(all)}<button class="btn ghost full" style="margin-top:12px" onclick="exportTransactions()">거래 내역 CSV로 저장하기</button><p class="small" style="margin-top:8px">CSV 파일에는 이 시제품의 가상 거래만 포함돼요.</p>`}
function exportTransactions(){let rows=[['날짜','사용처','금액','거래 종류','거래 후 잔액'],...state.transactions.map(t=>[fmtDate(t.date),t.store,t.amount,t.type,t.balanceAfter])];let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download='money-play-transactions.csv';a.click();URL.revokeObjectURL(url);toast('거래 내역 파일을 만들었어요')}
function learningPage(){let total=Object.keys(state.quizAnswered).length,correct=Object.values(state.quizAnswered).filter(x=>x.correct).length,pct=total?Math.round(correct/total*100):0;return `<h1 class="page-title">금융교육 현황 📚</h1><p class="page-sub">아이의 학습 과정과 금융 습관을 확인해요.</p>${levelWidget()}<div class="grid" style="margin-top:12px"><div class="card stat"><span class="emoji">🧠</span><strong>${total} / ${quizData.length}</strong><p>완료한 퀴즈</p></div><div class="card stat"><span class="emoji">🎯</span><strong>${state.missionDone.length} / ${state.missions.length}</strong><p>완료한 미션</p></div><div class="card stat"><span class="emoji">✨</span><strong>${state.points}P</strong><p>누적 포인트</p></div><div class="card stat"><span class="emoji">🎯</span><strong>${pct}%</strong><p>퀴즈 정답률</p></div></div>${section('학습 진행 그래프','') }<div class="card"><div class="bar-row"><div class="bar-label"><span>퀴즈 완료율</span><span>${Math.round(total/quizData.length*100)}%</span></div><div class="bar"><span style="width:${total/quizData.length*100}%"></span></div></div><div class="bar-row"><div class="bar-label"><span>퀴즈 정답률</span><span>${pct}%</span></div><div class="bar"><span style="width:${pct}%"></span></div></div><div class="bar-row"><div class="bar-label"><span>미션 달성률</span><span>${Math.round(state.missionDone.length/state.missions.length*100)}%</span></div><div class="bar"><span style="width:${state.missionDone.length/state.missions.length*100}%"></span></div></div><div class="bar-row"><div class="bar-label"><span>저축 목표 달성률</span><span>${Math.min(100,Math.round(state.savingsGoal.current/state.savingsGoal.target*100))}%</span></div><div class="bar"><span style="width:${Math.min(100,Math.round(state.savingsGoal.current/state.savingsGoal.target*100))}%"></span></div></div></div>${section('배운 주제','') }<div class="card">${[...new Set(state.historyLearned)].length?[...new Set(state.historyLearned)].map(x=>`<span class="pill" style="margin:3px">${esc(x)}</span>`).join(''):'<div class="empty"><span>🌱</span>퀴즈와 미션을 완료하면 배운 주제가 표시돼요.</div>'}</div>${section('퀴즈 기록','') }<div class="card">${Object.keys(state.quizAnswered).length?quizData.map((q,i)=>state.quizAnswered[i]?`<div class="transaction"><div class="tx-icon">${state.quizAnswered[i].correct?'✅':'📘'}</div><div class="tx-info"><strong>${esc(q.q)}</strong><small>${esc(q.cat)}</small></div><div class="tx-amount">${state.quizAnswered[i].correct?'정답':'다시 배우기'}</div></div>`:'').join(''):'<div class="empty"><span>🧠</span>아직 푼 퀴즈가 없어요.</div>'}</div>`}
function openSettings(){openModal(`<h2>⚙️ 설정</h2><p>시연 중 아이 화면과 부모 화면을 자유롭게 전환할 수 있어요. 모든 화면은 같은 가상 데이터를 사용해요.</p><div class="notice">현재 모드: ${state.mode==='child'?'아이 전용':'부모 전용'}</div><div class="modal-actions"><button class="btn primary" onclick="switchMode('child')">🐰 아이 모드</button><button class="btn" onclick="switchMode('parent')">👨‍👩‍👧 부모 모드</button></div><div class="divider"></div><button class="btn ghost full" onclick="exportBackup()">데이터 백업 파일 저장</button><button class="btn danger full" style="margin-top:8px" onclick="confirmReset()">시제품 데이터 초기화</button><button class="btn ghost full" style="margin-top:8px" onclick="exitToWelcome()">처음 화면으로 돌아가기</button><p class="small">이 데모는 로컬 브라우저에 데이터를 저장해요. 다른 기기나 브라우저와 자동 동기화되지는 않아요.</p>`,`<button class="btn ghost full" onclick="closeModal()">닫기</button>`)}
function openModal(body,actions=''){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function confirmReset(){openModal('<h2>초기화할까요?</h2><p>잔액, 거래 내역, 퀴즈 기록, 포인트와 설정이 데모 초기 상태로 돌아가요. 이 작업은 되돌릴 수 없어요.</p>','<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn danger" onclick="resetDemo()">초기화하기</button>')}
function resetDemo(){localStorage.removeItem(KEY);state=defaultState();save();closeModal();exitToWelcome();toast('시제품 데이터를 초기화했어요')}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='money-play-demo-backup.json';a.click();URL.revokeObjectURL(url);toast('백업 파일을 저장했어요')}
function tickClock(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}
tickClock();setInterval(tickClock,30000);
if(state.mode){document.getElementById('welcome').classList.add('hidden');document.getElementById('shell').classList.remove('hidden');page=state.mode==='child'?'home':'dashboard';render()}
</script>
</body>
</html>
